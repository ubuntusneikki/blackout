<script>
'use strict';
const VERSION = 'KOTI-01 V0.3';

// ================= PALETTI =================
const P = {
  bg0:'#0b1018', bg1:'#141c28', bg2:'#1f2a38', bg3:'#2c3a4a', bg4:'#46566a',
  br0:'#22191c', br1:'#33242a', br2:'#4a3330',
  cu0:'#5e321e', cu1:'#a8602f', cu2:'#d99a5b', cu3:'#f3d08a',
  gl0:'#16262e', gl1:'#2d4a55', gl2:'#4f7d86', gl3:'#9fd3d6',
  so0:'#140e0b', so1:'#2a1d16', so2:'#45301f', so3:'#6a4a30',
  mo1:'#3f6a26', mo2:'#79a83a', mo3:'#c2df6a',
  st0:'#8a7d68', st1:'#c9bc9c', st2:'#efe6cc',
  lamp:'#ffcf7a', lampD:'#7a5a2e',
  wa0:'#103540', wa1:'#1d6a78', wa2:'#5fc7d0',
  ui0:'#101722', ui1:'#1c2735', ui2:'#3a4b60', ui3:'#d8e2ea', uiD:'#6a7a8c',
  red:'#e0504a', grn:'#6ae07a'
};
const AMB = ['#7a4a14','#e8a02a','#ffe08a'];
const GB = [[14,23,18],[39,64,47],[95,130,87],[188,207,152]];

// ================= SISÄLTÖ =================
// Ilmasto: kostea (true/false), lämmin (true/false)
const VESSELS = {
  purkki:   {name:'LASIPURKKI',     wet:false, warm:false, size:0.7, dry:1200, rare:false},
  terraario:{name:'TERRAARIO',      wet:true,  warm:false, size:1.0, dry:2400, rare:false},
  akvaario: {name:'AKVAARIO',       wet:true,  warm:true,  size:1.2, dry:0,    rare:true},
  palvelin: {name:'PALVELINKAAPPI', wet:false, warm:true,  size:1.1, dry:900,  rare:true}
};
const STRAINS = {
  heltta: {name:'SINIHELTTA',   wet:true,  warm:false, grow:600,  yield:3, col:['#1d5c58','#34b8ac','#a8fbee'], style:'cap'},
  ruusu:  {name:'RUUSUSIENI',   wet:false, warm:true,  grow:900,  yield:4, col:['#5a1f4a','#c4428f','#ffa6d6'], style:'cluster'},
  kaapa:  {name:'TULIKÄÄPÄ',    wet:true,  warm:true,  grow:1200, yield:6, col:['#6b2e12','#d9702a','#ffc46a'], style:'shelf'},
  hamara: {name:'HÄMÄRÄNUPPI',  wet:false, warm:false, grow:750,  yield:3, col:['#3a1f5a','#8a4ad0','#d6b0ff'], style:'nubs'},
  hoitaja:{name:'HOITAJASIENI', wet:true,  warm:false, grow:400,  yield:0, col:['#2f5a3a','#8fd0a0','#e8fff0'], style:'tall', auto:true}
};
const MATCH_MULT = [0.5, 0.8, 1.3];

// ================= MARKKINA =================
// Valuutan työnimi: MK. Tuote-id: 'r:kanta' = perussato, 'j:kanta' = jaloste, 's:kanta' = itiö.
const CUR = 'MK';
const RAW_PRICE   = {heltta:2, ruusu:3, kaapa:4, hamara:3};          // perussato / kpl
const SPORE_PRICE = {heltta:4, ruusu:8, kaapa:10, hamara:7, hoitaja:25};
const REFINE = {   // jalostus: n perussatoa -> 1 jaloste
  heltta:{name:'SINITEE',     n:3},
  ruusu: {name:'RUUSUHILLO',  n:3},
  kaapa: {name:'TAULA',       n:3},
  hamara:{name:'HÄMÄRÄMUSTE', n:3}
};
const REFINE_BONUS = 1.6;   // jaloste on arvokkaampi kuin raaka-aineensa
const SAT_STEP = {r:0.06, j:0.14, s:0.2};  // kuinka paljon yksi myynti painaa hintaa
const SAT_HALF = 3600;      // pelisekunteja: kyllääntyminen puolittuu tunnissa (×60: minuutissa)
const SPIKE_EVERY = [1800, 4200], SPIKE_LEN = 1500, SPIKE_MULT = [1.8, 2.6];
function prodKind(id){ return id[0]; }
function prodKey(id){ return id.slice(2); }
function basePrice(id){ const k=prodKey(id);
  if (prodKind(id)==='r') return RAW_PRICE[k];
  if (prodKind(id)==='j') return Math.round(RAW_PRICE[k]*REFINE[k].n*REFINE_BONUS);
  return SPORE_PRICE[k]; }
function prodName(id){ const k=prodKey(id);
  if (prodKind(id)==='j') return REFINE[k].name;
  return STRAINS[k].name+(prodKind(id)==='s'?'-ITIÖ':''); }

// ================= TILA =================
var started = false;                    // true kun piirtosilmukka on käynnissä
const SAVE_KEY = 'solmu_yhteinen_v1';   // sama tallennus kuin ulkoprotossa
function newGame(){
  return {
    speed:60, rows:2, bought:{purkki:0, terraario:0}, expand:0, trips:0,
    retkiReady:0,
    slots:[ v('terraario'), v('purkki'), v('purkki'), null, null, null, null, null, null ],
    spores:{heltta:2}, vesselInv:[], kotiLast:Date.now(), firstHarvest:false,
    found:{}, cells:{}, memories:[], walked:0,
    mk:0, goods:{}, seen:{}, market:{sat:{}, spike:null, nextSpike:900}
  };
}
function ensure(s){ const d=newGame(); for (const k in d) if (s[k]===undefined) s[k]=d[k];
  // vanha tallennus: yksi sato-luku ja uute -> muunnetaan rahaksi (tehtävä 2 poisti uutteen)
  if (s.sato>0 || s.uute>0){ s.mk += (s.sato||0)*2 + (s.uute||0)*15; s.sato=0; s.uute=0; }
  if (!s.market.sat) s.market.sat={};
  return s; }
// koti omistaa nämä kentät: toisen välilehden tallennus ei saa ylikirjoittaa niitä
const KOTI_OWNS = ['slots','kotiLast','mk','goods','market','bought','expand','rows'];
function mergeIncoming(inc){ for (const k of KOTI_OWNS) inc[k]=S[k]; return ensure(inc); }
let uid = 1;
function v(type){ return {id:uid++, type, strain:null, growth:0, moist:1, ready:false}; }
let S;
try { S = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch(e){ S = null; }
if (!S){ try { S = JSON.parse(localStorage.getItem('koti_proto_v1')); if (S) S.kotiLast=S.last; } catch(e){ S=null; } }
if (!S || new URLSearchParams(location.search).has('reset')) S = newGame();
S = ensure(S);
uid = 1 + Math.max(0, ...S.slots.filter(Boolean).map(x => x.id));
function save(){ S.kotiLast = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} }

// offline-kasvu (max 8 h)
{ const away = Math.min(8*3600, (Date.now() - (S.kotiLast||Date.now()))/1000) * S.speed; if (away > 1) simulate(away); }

// ================= CANVAS =================
const W = 192, H = 336;
const screen = document.getElementById('c'), sctx = screen.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const g = buf.getContext('2d', {willReadFrequently:true});
function px(x,y,col){ g.fillStyle=col; g.fillRect(x|0,y|0,1,1); }
function rect(x,y,w,h,col){ g.fillStyle=col; g.fillRect(x|0,y|0,w|0,h|0); }
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);

const F={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',
F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',
K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',
P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',
Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110',
'4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111',
'9':'111101111001110','/':'001001010100100',':':'000010000010000','-':'000000111000000','.':'000000000000010',
'>':'100010001010100','<':'001010100010001',' ':'000000000000000','%':'101001010100101','+':'000010111010000',
'!':'010010010000010','=':'000111000111000','(':'010100100100010',')':'010001001001010',',':'000000000010100',
'?':'110001010000010','×':'000101010101000'};
function text(str,x,y,col){ for(const ch0 of String(str)){ let ch=ch0,u=false;
  if(ch==='Ä'){ch='A';u=true;} else if(ch==='Ö'){ch='O';u=true;}
  const gl=F[ch]||F[' ']; for(let i=0;i<15;i++) if(gl[i]==='1') px(x+i%3,y+(i/3|0),col);
  if(u){px(x,y-2,col);px(x+2,y-2,col);} x+=4; } }
const tw=s=>String(s).length*4-1;
function textC(str,cx,y,col){ text(str,Math.round(cx-tw(str)/2),y,col); }

// ================= PELILOGIIKKA =================
function matchOf(vs, st){ const V=VESSELS[vs.type], T=STRAINS[st]; return (V.wet===T.wet?1:0)+(V.warm===T.warm?1:0); }
function cols(){ return 3; }
function neighbors(i){ const c=i%3, r=(i/3)|0, out=[];
  if(c>0) out.push(i-1); if(c<2) out.push(i+1); if(r>0) out.push(i-3); if(r<S.rows-1) out.push(i+3); return out; }

function simulate(dt){
  // pilkotaan isot hypyt
  while (dt > 0){ const step=Math.min(dt, 5); dt-=step; tickGame(step); }
}
function tickGame(dt){
  S.slots.forEach((vs,i)=>{
    if(!vs) return;
    const V=VESSELS[vs.type];
    if (V.dry>0) vs.moist=Math.max(0, vs.moist - dt/V.dry); else vs.moist=1;
    if (vs.strain && STRAINS[vs.strain].auto){
      vs.moist=1;
      neighbors(i).forEach(j=>{ const n=S.slots[j]; if(n && n.moist<0.85) n.moist=Math.min(1,n.moist+dt/40); });
    }
    if (vs.strain && !vs.ready && vs.moist>0.1){
      const T=STRAINS[vs.strain];
      vs.growth += dt/T.grow * MATCH_MULT[matchOf(vs,vs.strain)];
      if (vs.growth>=1){ vs.growth=1; vs.ready = !T.auto; }
    }
  });
  marketTick(dt);
}
// markkinan oma aika: kyllääntyminen purkautuu ja kysyntäpiikit tulevat ja menevät
function marketTick(dt){
  const M=S.market, f=Math.pow(0.5, dt/SAT_HALF);
  for (const id in M.sat){ M.sat[id]*=f; if (M.sat[id]<0.005) delete M.sat[id]; }
  if (M.spike){ M.spike.left-=dt; if (M.spike.left<=0) M.spike=null; }
  M.nextSpike-=dt;
  if (M.nextSpike<=0){
    M.nextSpike = SPIKE_EVERY[0] + Math.random()*(SPIKE_EVERY[1]-SPIKE_EVERY[0]);
    // piikki osuu tuotteeseen, joka on jo tuttu (pelaaja on kasvattanut kantaa) tai satunnaiseen perussatoon
    const known = Object.keys(RAW_PRICE).filter(k=>S.seen[k]);
    const pool = known.length ? known : ['heltta'];
    const k = pool[(Math.random()*pool.length)|0], kind = Math.random()<0.5 ? 'r' : 'j';
    M.spike = {id:kind+':'+k, mult: SPIKE_MULT[0]+Math.random()*(SPIKE_MULT[1]-SPIKE_MULT[0]), left:SPIKE_LEN};
    if (started) toast('KYSYNTÄPIIKKI: '+prodName(M.spike.id)+' NYT ×'+M.spike.mult.toFixed(1));
  }
}
function unitPrice(id, extraSat){
  const M=S.market, sat=(M.sat[id]||0)+(extraSat||0);
  const sp = M.spike && M.spike.id===id ? M.spike.mult : 1;
  return Math.max(1, Math.round(basePrice(id)*sp/(1+sat)));
}
function owned(id){ return prodKind(id)==='s' ? (S.spores[prodKey(id)]||0) : (S.goods[id]||0); }
function take(id,n){ if (prodKind(id)==='s'){ S.spores[prodKey(id)]-=n; if (S.spores[prodKey(id)]<=0) delete S.spores[prodKey(id)]; }
  else { S.goods[id]-=n; if (S.goods[id]<=0) delete S.goods[id]; } }
// paljonko n kappaleen myynti tuottaa (hinta laskee kappale kappaleelta)
function quote(id,n){ let sum=0; for(let i=0;i<n;i++) sum+=unitPrice(id, i*SAT_STEP[prodKind(id)]); return sum; }
function sell(id,n){
  n=Math.min(n,owned(id)); if(n<=0) return;
  const got=quote(id,n); take(id,n); S.mk+=got;
  S.market.sat[id]=(S.market.sat[id]||0)+n*SAT_STEP[prodKind(id)];
  toast('MYIT '+n+' × '+prodName(id)+' +'+got+' '+CUR); save();
}
function refineOne(k){
  const R=REFINE[k], id='r:'+k; if ((S.goods[id]||0)<R.n) return;
  take(id,R.n); S.goods['j:'+k]=(S.goods['j:'+k]||0)+1;
  toast(R.n+' × '+STRAINS[k].name+' > 1 × '+R.name); save();
}

let msg = '', msgT = 0;
function toast(m){ msg=m; msgT=performance.now(); }

function harvest(vs){
  const T=STRAINS[vs.strain];
  const n=Math.max(1, Math.round(T.yield*VESSELS[vs.type].size*MATCH_MULT[matchOf(vs,vs.strain)]));
  S.goods['r:'+vs.strain]=(S.goods['r:'+vs.strain]||0)+n; vs.ready=false; vs.growth=0.35;
  S.seen[vs.strain]=1;
  let extra='';
  if (Math.random()<0.35){ S.spores[vs.strain]=(S.spores[vs.strain]||0)+1; extra=' + 1 ITIÖ'; }
  if (!S.firstHarvest){ S.firstHarvest=true; extra+='. VIE SATO MARKKINALLE TAI JALOSTA'; }
  toast('+'+n+' × '+T.name+extra);
  burst = {t:performance.now()};
  save();
}
function plant(vs, key){
  vs.strain=key; vs.growth=0; vs.ready=false; vs.moist=Math.max(vs.moist,0.6);
  S.spores[key]--; if(S.spores[key]<=0) delete S.spores[key];
  wake[vs.id]=0; toast(STRAINS[key].name+' ISTUTETTU');
  save();
}
function marketPrice(type){ return type==='purkki' ? 10+6*S.bought.purkki : 25+12*S.bought.terraario; }
function expandPrice(){ return 80+80*S.expand; }
function retki(){
  const now=Date.now(); if (now<S.retkiReady) return;
  S.trips++; S.retkiReady = now + 12000;
  let r;
  if (S.trips===1) r={kind:'strain',key:'ruusu',n:2};
  else if (S.trips===2) r={kind:'vessel',key:'akvaario'};
  else if (S.trips===3) r={kind:'strain',key:'hoitaja',n:1};
  else { const pool=[{kind:'strain',key:'ruusu',n:1},{kind:'strain',key:'heltta',n:2},{kind:'strain',key:'kaapa',n:1},
      {kind:'strain',key:'hamara',n:1},{kind:'vessel',key:'palvelin'},{kind:'vessel',key:'akvaario'},{kind:'strain',key:'hoitaja',n:1}];
    r=pool[(Math.random()*pool.length)|0]; }
  give(r);
  const what = r.kind==='strain' ? r.n+' × '+STRAINS[r.key].name+'-ITIÖ' : VESSELS[r.key].name;
  toast('RETKI: LÖYSIT '+what);
  save();
}
function give(r){
  if (r.kind==='strain') S.spores[r.key]=(S.spores[r.key]||0)+r.n;
  else if (r.kind==='vessel') S.vesselInv.push(r.key);
}

// ================= UI-TILA =================
let winRect=null, roomV=0, view='room', sel=-1, modal=null, burst=null;
const wake={};               // vessel id -> 0..1 heräämisanimaatio
S.slots.forEach(vs=>{ if(vs) wake[vs.id]= vs.strain?1:0; });
let HIT=[];
function button(x,y,w,h,label,fn,style){
  const st=style||'n';
  const bgc= st==='a'?AMB[1]: st==='d'?P.ui1 : st==='g'?'#1d5c58' : P.ui2;
  const hi = st==='a'?AMB[2]: st==='d'?P.ui1 : st==='g'?'#34b8ac' : P.bg4;
  const fg = st==='a'?P.ui0 : st==='d'?P.uiD : P.ui3;
  rect(x,y,w,h,bgc); rect(x,y,w,1,hi);
  textC(label,x+w/2,y+((h-5)>>1)+ (h>9?0:0),fg);
  if (st!=='d') HIT.push({x,y,w,h,fn});
}

// ================= HUONENÄKYMÄ =================
const SLOT_W=56, SLOT_H=56;
function slotXY(i){ const c=i%3, r=(i/3)|0; return [8+c*60, 72+r*64]; }

function roomWallRects(){ // seinä = kaikki paitsi astiapaikat ja ikkuna
  const out=[[0,14,W,258,roomV]];
  // astiapaikat saavat oman arvonsa myöhemmin; tyhjät paikat ja hyllyt kuuluvat seinään
  return out; }
function drawWall(){
  const r=rng(11);
  rect(0,14,W,258,P.bg0);
  for(let y=14;y<272;y+=7){ const off=((y/7)|0)%2?0:7;
    for(let x=-14+off;x<W;x+=14){ const q=r(); rect(x+1,y+1,12,5,q<0.15?P.br2:q<0.55?P.br1:P.br0); } }
}

// ikkuna ja kortteli
const SKY=(()=>{ const r=rng(77), segs=[];
  for(let s=0;s<5;s++){ const b=[]; let x=0; while(x<34){ const w=6+(r()*9|0), h=8+(r()*22|0); b.push({x,w,h,win:r()}); x+=w+1; } segs.push(b); }
  return segs; })();
function drawWindow(t){
  const X0=8,Y0=18,WW=176,HH=44;
  rect(X0-3,Y0-3,WW+6,HH+6,P.cu1); rect(X0-3,Y0-3,WW+6,1,P.cu3); rect(X0-3,Y0+HH+2,WW+6,1,P.cu0);
  // taivas
  for(let y=Y0;y<Y0+HH;y++){ const f=(y-Y0)/HH;
    rect(X0,y,WW,1, f<0.35?'#1b2a4a': f<0.7?'#3a3a5e':'#7a4a5a'); }
  for(let y=Y0+HH-14;y<Y0+HH;y++) for(let x=X0;x<X0+WW;x++) if(BAYER[y&3][x&3]<((y-(Y0+HH-14))/14)*10) px(x,y,'#d9845a');
  // korttelit
  for(let s=0;s<5;s++){ const sx=X0+s*35+1;
    SKY[s].forEach(b=>{ const by=Y0+HH-b.h;
      rect(sx+b.x,by,b.w,b.h,'#2a2238'); rect(sx+b.x,by,1,b.h,'#3a3048');
      for(let wy=by+2;wy<Y0+HH-2;wy+=4) for(let wx=sx+b.x+1;wx<sx+b.x+b.w-1;wx+=3)
        if(((wx*7+wy*13)%5)<2) px(wx,wy,'#ffcf7a');
    });
    // kasvusto ja hehku parannetuilla alueilla
    const rr=rng(300+s);
    for(let k=0;k<6;k++){ const x=sx+(rr()*33|0), y=Y0+HH-1; const h=2+(rr()*4|0);
      for(let q=0;q<h;q++) for(let d=-1;d<=1;d++) if(rr()<0.8) px(x+d,y-q,q===h-1?'#c2df6a':'#79a83a'); }
    for(let k=0;k<3;k++){ const x=sx+4+(rr()*26|0), y=Y0+HH-3-(rr()*16|0);
      if(Math.sin(t*2+k+s)>-0.2) px(x,y,['#a8fbee','#ffa6d6','#ffc46a'][k]); }
  }
  rect(X0+WW/2-1,Y0,2,HH,P.cu1);
  rect(X0,Y0+HH/2-1,WW,1,P.cu0);
  // ikkunanäkymä pysyy hillittynä (kaupungin värin palauttaminen poistettiin suunnasta)
  winRect=[X0,Y0,WW,HH,0.45];
}

function drawMiniVessel(vs,x,y,t,i){
  const T=vs.strain?STRAINS[vs.strain]:null;
  const ix0=x+5, ix1=x+SLOT_W-6, it=y+12, soil=y+SLOT_H-9;
  // runko
  if (vs.type==='purkki'){
    rect(x+8,y+6,SLOT_W-16,SLOT_H-6,P.gl1); rect(x+10,y+8,SLOT_W-20,SLOT_H-10,P.gl0);
    rect(x+14,y+2,SLOT_W-28,5,P.so3); rect(x+14,y+2,SLOT_W-28,1,P.st0);
  } else if (vs.type==='palvelin'){

function haloIn(cx,cy,rad,col,strength,x0,x1){
  for(let y=(cy-rad)|0;y<=cy+rad;y++) for(let x=(cx-rad)|0;x<=cx+rad;x++){
    const d=Math.hypot(x-cx,(y-cy)*1.3); if(d>rad||x<=x0||x>=x1||y<=TY0+2||y>=SOIL) continue;
    if(BAYER[y&3][x&3] < (1-d/rad)*16*strength) px(x,y,col); }
}
function capShroom(x,h,w,col,life,t,ph,x0,x1,opts){
  const [lo,mid,hi]=col, round=opts&&opts.round, dry=opts&&opts.dry;
  const hh=Math.max(3,Math.round(h*(0.2+0.8*life))), ww=Math.max(3,Math.round(w*(0.35+0.65*life)));
  const top=SOIL-1-hh, capH=Math.max(2,Math.round(ww*(round?0.7:0.48))), droop=dry?2:0;
  if(life>0.05&&!dry) haloIn(x,top-capH/2,ww*0.85+4,lo,life*(0.75+0.25*Math.sin(t*2.2+ph)),x0,x1);
  const sw=ww>30?4:ww>16?3:ww>7?2:1, sx=x-(sw>>1);
  rect(sx,top,sw,hh,P.st1); if(sw>1) rect(sx+sw-1,top,1,hh,P.st0); if(sw>2) rect(sx,top,1,hh,P.st2);
  for(let i=0;i<capH;i++){ const k=(capH-i)/capH, half=Math.round((ww/2)*Math.sqrt(1-k*k*0.85));
    for(let xx=x-half;xx<=x+half;xx++){ let c=mid; if(i===0||(xx===x-half&&i<capH-1)) c=hi; if(xx>x+half-Math.max(1,half/3)) c=lo;
      px(xx,top-capH+i+droop,c);} }
  if(ww>12) for(const [dx,dy] of [[-7,2],[2,1],[-2,4],[7,3],[-11,5],[11,6]]) if(Math.abs(dx)<ww/2-1&&dy<capH-1) px(x+dx,top-capH+dy+droop,hi);
  return top-capH;
}

  return topY;
}

    text(T?T.name:'TYHJÄ - HAALISTUNUT',5,287,T?T.col[2]:P.ui3);
  }
  text('KOSTEUS',5,297,P.ui3); bar(46,297,vs.moist, vs.moist<0.25?P.red:P.wa2);
  if (T && !T.auto){ text('KASVU',5,305,P.ui3); bar(46,305,vs.growth, vs.ready?AMB[1]:T.col[1]); }
  if (T){ const m=matchOf(vs,vs.strain); text(['HUONO ASTIA','KELPO ASTIA','TÄYDELLINEN'][m],116,301, m===2?P.grn:m===1?P.ui3:P.red); }
  button(4,318,44,14,'< HUONE',()=>{ view='room'; });
  button(51,318,44,14,'SUMUTA',()=>{ vs.moist=1; toast('SUMUTETTU'); save(); }, (vs.moist<0.35&&V.dry>0)?'g':(V.dry>0?'n':'d'));
  if (!T) button(98,318,90,14,'ISTUTA',()=>{ modal={type:'plant',slot:sel}; }, Object.keys(S.spores).length?'a':'d');
  else if (vs.ready) button(98,318,90,14,'KORJAA SATO',()=>harvest(vs),'a');
  else if (T.auto) button(98,318,90,14,'HOITAA NAAPUREITA',()=>{},'d');
  else button(98,318,90,14,(vs.moist<0.1?'KUIVUNUT':'KASVAA '+Math.floor(vs.growth*100)+'%'),()=>{},'d');
}
function bar(x,y,v,col){ for(let i=0;i<10;i++) rect(x+i*6,y,5,5,i<Math.round(v*10)?col:P.ui1); }

// ================= MODAALIT =================
function drawModal(){
  if (!modal) return;
  // himmennys
  for(let y=0;y<H;y++) for(let x=(y&1);x<W;x+=2) px(x,y,P.bg0);
  HIT=[];
  const X=10,Y=66,WW=172,HH=200;
  rect(X,Y,WW,HH,P.ui0); rect(X,Y,WW,1,P.ui2); rect(X,Y+HH-1,WW,1,P.ui2); rect(X,Y,1,HH,P.ui2); rect(X+WW-1,Y,1,HH,P.ui2);
  let y=Y+20;
  const row=(label,right,fn,ok,sub)=>{ const st=ok?'n':'d';
    rect(X+6,y,WW-12,sub?20:13,ok?P.ui2:P.ui1); rect(X+6,y,WW-12,1,ok?P.bg4:P.ui1);
    text(label,X+10,y+4,ok?P.ui3:P.uiD); if(right) text(right,X+WW-10-tw(right),y+4,ok?AMB[2]:P.uiD);
    if(sub) text(sub,X+10,y+12,ok?P.uiD:P.ui2);
    if(ok) HIT.push({x:X+6,y,w:WW-12,h:sub?20:13,fn});
    y+=sub?23:16; };
  // rivi, jossa on oikealla pieni sivunappi (esim. MYY KAIKKI)
  const row2=(label,right,sub,fn,ok,side,sideFn,rightCol,subCol)=>{
    const rw=WW-12-(side?38:0);
    rect(X+6,y,rw,20,ok?P.ui2:P.ui1); rect(X+6,y,rw,1,ok?P.bg4:P.ui1);
    text(label,X+10,y+4,ok?P.ui3:P.uiD); if(right) text(right,X+6+rw-4-tw(right),y+4,ok?(rightCol||P.ui3):P.uiD);
    if(sub) text(sub,X+10,y+12,subCol||(ok?P.uiD:P.ui2));
    if(ok) HIT.push({x:X+6,y,w:rw,h:20,fn});
    if(side) button(X+WW-6-36,y,36,20,side,sideFn,ok?'n':'d');
    y+=23; };
  const pager=(n,per)=>{ const pages=Math.max(1,Math.ceil(n/per)); modal.page=Math.min(modal.page||0,pages-1);
    if(pages>1){ const lbl=(modal.page+1)+'/'+pages; button(X+WW-36,Y+HH-18,30,13,'>',()=>{ modal.page=(modal.page+1)%pages; }); text(lbl,X+8,Y+HH-14,P.uiD); }
    return modal.page*per; };
  if (modal.type==='market'){
    textC('MARKKINA',X+WW/2,Y+5,AMB[2]);
    button(X+6,Y+14,78,11,'MYY',()=>{ modal.tab='sell'; modal.page=0; }, modal.tab==='sell'?'g':'n');
    button(X+WW-84,Y+14,78,11,'OSTA',()=>{ modal.tab='buy'; modal.page=0; }, modal.tab==='buy'?'g':'n');
    y=Y+30;
    text('RAHAA: '+S.mk+' '+CUR,X+8,y,P.ui3);
    const sp=S.market.spike;
    if (sp){ const m=Math.ceil(sp.left/60/S.speed); const s2='PIIKKI '+(m>0?m:1)+' MIN'; text(s2,X+WW-8-tw(s2),y,AMB[1]); }
    y+=10;
    if (modal.tab==='sell'){
      const ids=[];
      for (const k of Object.keys(RAW_PRICE)){ if(S.goods['r:'+k]) ids.push('r:'+k); if(S.goods['j:'+k]) ids.push('j:'+k); }
      for (const k of Object.keys(SPORE_PRICE)) if (S.spores[k]) ids.push('s:'+k);
      // kysyntäpiikin tuote ensin
      if (sp) ids.sort((a,b)=>(b===sp.id)-(a===sp.id));
      if (!ids.length) wrap('EI MYYTÄVÄÄ. KORJAA SATOA TAI JALOSTA SITÄ.',X+10,y,154,P.uiD);
      const first=pager(ids.length,6);
      ids.slice(first,first+6).forEach(id=>{
        const n=owned(id), up=unitPrice(id), base=basePrice(id), spike=sp&&sp.id===id;
        const pct=Math.round((up/base-1)*100);
        const trend = spike ? 'KYSYNTÄ ×'+sp.mult.toFixed(1) : pct<=-5 ? 'HINTA '+pct+'%' : 'NORMAALIHINTA';
        row2(prodName(id), up+' '+CUR, '× '+n+'  '+trend, ()=>sell(id,1), true,
             'KAIKKI', ()=>sell(id,n), spike?AMB[2]:P.ui3, spike?AMB[1]:pct<=-25?'#c4428f':P.uiD);
      });
    } else {
      const pp=marketPrice('purkki'), pt=marketPrice('terraario'), pe=expandPrice();
      const buy=(cost,fn)=>()=>{ if(S.mk<cost) return; S.mk-=cost; fn(); modal=null; save(); };
      row2('LASIPURKKI',pp+' '+CUR,'KUIVA / VIILEÄ',buy(pp,()=>{ S.bought.purkki++; S.vesselInv.push('purkki'); toast('OSTIT LASIPURKIN. ASETA SE HYLLYYN'); }), S.mk>=pp);
      row2('TERRAARIO',pt+' '+CUR,'KOSTEA / VIILEÄ',buy(pt,()=>{ S.bought.terraario++; S.vesselInv.push('terraario'); toast('OSTIT TERRAARION. ASETA SE HYLLYYN'); }), S.mk>=pt);
      if (S.rows<3) row2('LAAJENNA HYLLY',pe+' '+CUR,'+3 PAIKKAA',buy(pe,()=>{ S.expand++; S.rows++; toast('HYLLYSSÄ ON NYT 3 UUTTA PAIKKAA'); }), S.mk>=pe);
      y+=4; wrap('ERIKOISASTIOITA EI MYYDÄ TÄÄLLÄ. NE LÖYTYVÄT ULKOA.',X+10,y,154,P.uiD);
    }
  }
  else if (modal.type==='refine'){
    textC('JALOSTAMO',X+WW/2,Y+5,AMB[2]);
    y=Y+18; wrap('JALOSTE ON ARVOKKAAMPI KUIN RAAKA-AINEENSA.',X+8,y,156,P.uiD); y+=20;
    const ks=Object.keys(REFINE).filter(k=>S.seen[k]||S.goods['r:'+k]||S.goods['j:'+k]);
    if (!ks.length) wrap('KORJAA ENSIN SATOA.',X+10,y,154,P.uiD);
    ks.forEach(k=>{ const R=REFINE[k], have=S.goods['r:'+k]||0, ok=have>=R.n;
      row2(R.name, R.n+' > 1', STRAINS[k].name+' '+have+'  HINTA '+unitPrice('j:'+k)+' '+CUR, ()=>refineOne(k), ok,
           'KAIKKI', ()=>{ const n=Math.floor((S.goods['r:'+k]||0)/R.n); for(let i=0;i<n;i++) refineOne(k); if(n>1) toast('JALOSTIT '+n+' × '+R.name); },
           ok?P.ui3:P.uiD, ok?P.uiD:P.ui2); });
  }
  else if (modal.type==='place'){
    textC('ASETA ASTIA',X+WW/2,Y+7,AMB[2]);
    const seen={};
    S.vesselInv.forEach((t,k)=>{ if(seen[t]) return; seen[t]=1; const n=S.vesselInv.filter(x=>x===t).length, V=VESSELS[t];
      row(V.name,'× '+n,()=>{ S.vesselInv.splice(S.vesselInv.indexOf(t),1); const nv=v(t); S.slots[modal.slot]=nv; wake[nv.id]=0; toast(V.name+' ASETETTU'); modal=null; save(); }, true,
        (V.wet?'KOSTEA':'KUIVA')+' / '+(V.warm?'LÄMMIN':'VIILEÄ')+(V.rare?'  HARVINAINEN':'')); });
  }
  else if (modal.type==='plant'){
    const vs=S.slots[modal.slot];
    textC('ISTUTA: '+VESSELS[vs.type].name,X+WW/2,Y+7,AMB[2]);
    const keys=Object.keys(S.spores);
    if(!keys.length){ wrap('EI ITIÖITÄ. KORJAA SATOA TAI LÄHDE RETKELLE.',X+10,y,154,P.uiD); }
    keys.forEach(k=>{ const T=STRAINS[k], m=matchOf(vs,k);
      row(T.name,['HUONO','KELPO','TÄYDELLINEN'][m],()=>{ plant(vs,k); modal=null; }, true,
        'ITIÖITÄ '+S.spores[k]+'  '+(T.wet?'KOSTEA':'KUIVA')+' / '+(T.warm?'LÄMMIN':'VIILEÄ')); });
  }
  else if (modal.type==='settings'){
    textC('ASETUKSET',X+WW/2,Y+7,AMB[2]);
    row('NOPEUS', S.speed===60?'×60 TESTI':'×1 OIKEA', ()=>{ S.speed = S.speed===60?1:60; save(); }, true, 'KASVU OIKEASSA AJASSA TAI 60X');
    row('TESTILÖYTÖ', Date.now()>=S.retkiReady?'':'ODOTA', ()=>{ retki(); modal=null; }, Date.now()>=S.retkiReady, 'SIMULOI ULKOLÖYDÖN');
    row('UUSI PELI','',()=>{ S=newGame(); for(const k in wake) delete wake[k]; S.slots.forEach(vs=>{ if(vs) wake[vs.id]=0; }); modal=null; view='room'; save(); toast('UUSI PELI ALOITETTU'); }, true, 'POISTAA TALLENNUKSEN');
    y+=4; text(VERSION,X+10,y,P.uiD);
  }
  button(X+WW/2-30,Y+HH-18,60,13,'SULJE',()=>{ modal=null; });
}

// ================= SILMUKKA =================
let monoRects=[], waveR=-1, sceneV=1;
// elinvoima: v=0 haalea ja harmaanvihreä, v=1 lopulliset värit täysin kylläisinä
function vital(d,i,v){
  const r=d[i],gg=d[i+1],b=d[i+2], l=0.3*r+0.59*gg+0.11*b, s=0.1+0.9*v, br=0.6+0.4*v;
  d[i]  =clamp((l*0.9 +(r -l*0.9 )*s)*br,0,255);
  d[i+1]=clamp((l*1.0 +(gg-l*1.0 )*s)*br,0,255);
  d[i+2]=clamp((l*0.84+(b -l*0.84)*s)*br,0,255);
}
function vesselV(vs){ if(!vs||!vs.strain) return 0;
  const wet = vs.moist>0.25 ? 1 : vs.moist/0.25;
  return clamp(0.3 + 0.5*vs.growth + 0.2*wet - (vs.moist<0.1?0.25:0), 0, 1); }
function render(ms){
  const t=ms/1000;
  HIT=[]; monoRects=[]; waveR=-1; sceneV=1;
  if (view==='room') drawRoom(t); else drawVessel(t);
  // yläpalkki
  rect(0,0,W,13,P.ui0); rect(0,13,W,1,P.ui2);
  text(view==='room'?'SOLMU':'SOLMU > '+(S.slots[sel]?VESSELS[S.slots[sel].type].name:''),4,4,P.ui3);
  const nGoods=Object.values(S.goods).reduce((a,b)=>a+b,0);
  const res='SATO '+nGoods+'  '+S.mk+' '+CUR;
  text(res,W-4-tw(res),4,AMB[2]);
  if (S.speed!==1) text('×60',view==='room'?30:W-4-tw(res)-18,4,P.uiD);
  HIT.push({x:0,y:0,w:W,h:13,fn:()=>{ modal={type:'settings'}; }});
  // mono-jälkikäsittely
  if (view==='room'){ monoRects.unshift(...roomWallRects()); if(winRect) monoRects.push(winRect); }
  if (monoRects.length || waveR>=0){
    const img=g.getImageData(0,14,W,258), d=img.data;
    const skip = view==='room' ? S.slots.slice(0,S.rows*3).map((vs,i)=>vs?slotXY(i):null).filter(Boolean) : [];
    const inSlot=(x,y)=>{ for(const [sx,sy,sw,sh] of skip) if(x>=sx&&x<sx+(sw||SLOT_W)&&y>=sy&&y<sy+(sh||SLOT_H)) return true; return false; };
    if (view==='room') skip.push([8,18,176,44]);
    let wallN = view==='room' ? 1 : 0;
    for(const [rx,ry,rw,rh,vv] of monoRects){ const isWall = wallN-- > 0;
      for(let y=Math.max(14,ry);y<Math.min(272,ry+rh);y++) for(let x=Math.max(0,rx);x<Math.min(W,rx+rw);x++){ if(isWall&&inSlot(x,y)) continue; vital(d,((y-14)*W+x)*4,vv); }
    }
    if (waveR>=0){
      for(let y=14;y<272;y++) for(let x=0;x<W;x++){ const dist=Math.hypot(x-ORIGIN[0],y-ORIGIN[1]); const i=((y-14)*W+x)*4;
        if(dist<waveR-1.5){ if(sceneV<1) vital(d,i,sceneV); continue; }
        if(Math.abs(dist-waveR)<=1.5 && BAYER[y&3][x&3]<9){ d[i]=168; d[i+1]=251; d[i+2]=238; } else vital(d,i,0); }
    }
    g.putImageData(img,0,14);
  }
  drawModal();
  sctx.imageSmoothingEnabled=false;
  sctx.drawImage(buf,0,0,W,H,0,0,screen.width,screen.height);
}

let lastMs=performance.now(), lastFrame=0, lastSave=0;
function loop(ms){
  const dt=Math.min(1,(ms-lastMs)/1000); lastMs=ms;
  if(!modal) tickGame(dt*S.speed);
  if (ms-lastFrame>90){ lastFrame=ms; render(ms); }
  if (ms-lastSave>3000){ lastSave=ms; save(); }
  requestAnimationFrame(loop);
}
function fit(){ const k=Math.max(1,Math.floor(Math.min(innerWidth/W,innerHeight/H))); screen.width=W*k; screen.height=H*k; }
addEventListener('resize',fit); fit();
screen.addEventListener('pointerdown',e=>{
  const r=screen.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.x&&x<h.x+h.w&&y>=h.y&&y<h.y+h.h){ h.fn(); render(performance.now()); return; } }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); else {
  try { const inc=JSON.parse(localStorage.getItem(SAVE_KEY)); if(inc) S=mergeIncoming(inc); } catch(e){}
  const away=Math.min(8*3600,(Date.now()-S.kotiLast)/1000)*S.speed; if(away>2) simulate(away); lastMs=performance.now(); } });
addEventListener('storage',e=>{ if(e.key!==SAVE_KEY||!e.newValue) return; try { S=mergeIncoming(JSON.parse(e.newValue)); } catch(_){} });
window.__S=()=>S; window.__sim=simulate;
started=true;
requestAnimationFrame(loop);
</script>

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function hashStr(str){ let h=2166136261; for (const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function seeded(str){ let a=hashStr(str)||1; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
function hexRGB(h){ const n=parseInt(h.slice(1),16); return [n>>16,(n>>8)&255,n&255]; }

function text(str,x,y,col){ for(const ch0 of String(str)){ let ch=ch0,u=false;

function wrapLines(str,maxw){ const out=[]; let line=''; for(const w of String(str).split(' ')){ const t=line?line+' '+w:w; if(tw(t)>maxw&&line){ out.push(line); line=w; } else line=t; } if(line) out.push(line); return out; }
function wrap(str,x,y,maxw,col,lh){ wrapLines(str,maxw).forEach((l,i)=>text(l,x,y+i*(lh||8),col)); }

// ================= ELINVOIMA-VÄRITYS =================
// v=0: haalea, harmaanvihreä ja himmeä. v=1: lopulliset värit täysin kylläisinä.
function vital(d,i,v){
  const r=d[i],gg=d[i+1],b=d[i+2], l=0.3*r+0.59*gg+0.11*b;
  const s=0.1+0.9*v, br=0.6+0.4*v;
  d[i]  =clamp((l*0.9 +(r -l*0.9 )*s)*br,0,255);
  d[i+1]=clamp((l*1.0 +(gg-l*1.0 )*s)*br,0,255);
  d[i+2]=clamp((l*0.84+(b -l*0.84)*s)*br,0,255);
}

// ================= PROJEKTIO =================
const START={lat:60.4518, lon:22.2666};
let origin={...START};
const kx=()=>Math.cos(origin.lat*Math.PI/180)*111320;
const toXY=(lat,lon)=>[(lon-origin.lon)*kx(), -(lat-origin.lat)*110540];
const toLL=(x,y)=>({lat:origin.lat-y/110540, lon:origin.lon+x/kx()});

// ================= OSM =================
function classify(t){
  if (!t) return null;
  if (t.power||t.man_made==='mast'||t.man_made==='communications_tower'||t.man_made==='tower') return 'verkko';
  if (['library','school','university','college'].includes(t.amenity)) return 'arkisto';
  if (t.natural==='water'||t.waterway==='riverbank') return 'ranta';
  if (t.landuse==='industrial'||t.landuse==='retail'||t.shop==='mall') return 'teollinen';
  if (t.landuse==='forest'||t.landuse==='meadow'||t.landuse==='grass'||t.natural==='wood'||t.natural==='scrub'||t.leisure==='park'||t.leisure==='garden'||t.landuse==='cemetery') return 'puisto';
  return null;
}
let osmNote='', bootLines=[];
const bootSay=s=>{ bootLines.push(s); if(bootLines.length>18) bootLines.shift(); };
const SERVERS=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
async function overpass(q,label){ const errs=[];
  for (const url of SERVERS){ const host=url.split('/')[2];
    for (let a=0;a<2;a++){ const ctrl=new AbortController(), to=setTimeout(()=>ctrl.abort(),30000);
      try { if(booting) bootSay('  '+label+': '+host+(a?' (UUSI YRITYS)':''));
        const res=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctrl.signal});
        clearTimeout(to); if(res.ok){ osmNote=host; return await res.json(); }
        errs.push(host+' '+res.status); if([429,502,503,504].includes(res.status)&&a===0){ await new Promise(r=>setTimeout(r,2500)); continue; } break;
      } catch(e){ clearTimeout(to); errs.push(host+' '+(e.name==='AbortError'?'AIKAKATKAISU':e.message)); break; } } }
  throw new Error(errs.join(' | '));
}
let features=[], anchors=[], seenOSM=new Set(), mapMode='OSM';
const TLAT=0.005, TLON=0.010, tiles={};
const tileOf=(lat,lon)=>[Math.floor(lat/TLAT),Math.floor(lon/TLON)];
function parseOSM(els){ const out=[];
  for (const el of els){ const uid=el.type[0]+el.id; if(seenOSM.has(uid)) continue; seenOSM.add(uid);
    const t=el.tags||{}, z=classify(t);
    if (el.type==='node'||el.center){ if(z){ const c=el.center||el; const [x,y]=toXY(c.lat,c.lon); out.push({kind:'point',x,y,zone:z,id:uid}); } continue; }
    const geom=el.geometry; if(!geom||geom.length<2) continue;
    const pts=geom.map(p=>toXY(p.lat,p.lon));
    const closed=pts.length>3&&geom[0].lat===geom[geom.length-1].lat&&geom[0].lon===geom[geom.length-1].lon;
    if (t.highway){ out.push({kind:'line',pts,cls:/primary|secondary|trunk|tertiary/.test(t.highway)?'road1':/footway|path|cycleway|pedestrian/.test(t.highway)?'path':'road2',id:uid,zone:/residential|living_street/.test(t.highway)?'piha':null}); continue; }
    if (t.waterway&&!closed){ out.push({kind:'line',pts,cls:'water',zone:'ranta',id:uid,w:14}); continue; }
    if (t.building){ out.push({kind:'area',pts,cls:'building'}); continue; }
    if (z&&closed) out.push({kind:'area',pts,zone:z,id:uid});
  }
  return out;
}
async function loadTile(ty,tx){
  const s_=ty*TLAT,w_=tx*TLON,bb=`${s_.toFixed(5)},${w_.toFixed(5)},${(s_+TLAT).toFixed(5)},${(w_+TLON).toFixed(5)}`;
  const qMain=`[out:json][timeout:25][bbox:${bb}];
(way["highway"~"^(primary|secondary|tertiary|residential|unclassified|living_street|pedestrian|service|footway|cycleway|path)$"];
 way["landuse"~"^(industrial|forest|meadow|grass|retail|cemetery)$"];
 way["natural"~"^(wood|water|scrub)$"];
 way["leisure"~"^(park|garden)$"];
 way["waterway"~"^(river|stream|canal)$"];);
out geom qt;
(nwr["amenity"~"^(library|school|university|college)$"];
 nwr["power"~"^(substation|plant|transformer)$"];
 nwr["man_made"~"^(mast|tower|communications_tower)$"];
 nwr["shop"="mall"];);
out center qt;`;
  const qB=`[out:json][timeout:25][bbox:${bb}];way["building"];out geom qt;`;
  const ck='osmt_'+ty+'_'+tx; let main=null,bld=null;
  try { const c=JSON.parse(localStorage.getItem(ck)); if(c&&Date.now()-c.t<7*864e5){ main=c.m; bld=c.b; osmNote='VÄLIMUISTI'; } } catch(e){}
  if(!main){ main=await overpass(qMain,'KARTTA'); try{ bld=await overpass(qB,'RAKENNUKSET'); }catch(e){ bld={elements:[]}; }
    try{ localStorage.setItem(ck,JSON.stringify({t:Date.now(),m:main,b:bld})); }catch(e){ try{ for(const k of Object.keys(localStorage)) if(k.startsWith('osmt_')) localStorage.removeItem(k); }catch(_){} } }
  return parseOSM(main.elements.concat(bld.elements));
}
function inPoly(x,y,pts){ let c=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const [xi,yi]=pts[i],[xj,yj]=pts[j]; if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; }
function addFeatures(nf){
  features.push(...nf);
  // ankkurit: paikat, joihin löytö voi syntyä
  for (const f of nf){ if(!f.zone) continue;
    if (f.kind==='point') anchors.push({x:f.x,y:f.y,zone:f.zone,id:f.id});
    else if (f.kind==='area'){ let cx=0,cy=0; f.pts.forEach(p=>{cx+=p[0];cy+=p[1];}); cx/=f.pts.length; cy/=f.pts.length;
      if(!inPoly(cx,cy,f.pts)){ cx=(f.pts[0][0]+f.pts[1][0])/2; cy=(f.pts[0][1]+f.pts[1][1])/2; }
      anchors.push({x:cx,y:cy,zone:f.zone,id:f.id});
      // isoille alueille lisää ankkureita
      const r=seeded(f.id); for(let k=0;k<6;k++){ const a=f.pts[(r()*f.pts.length)|0], q=r(); const x=a[0]+(cx-a[0])*q, y=a[1]+(cy-a[1])*q; if(inPoly(x,y,f.pts)) anchors.push({x,y,zone:f.zone,id:f.id+'_'+k}); } }
    else if (f.kind==='line'){ let acc=0; for(let i=1;i<f.pts.length;i++){ const [ax,ay]=f.pts[i-1],[bx,by]=f.pts[i], L=Math.hypot(bx-ax,by-ay);
      for(let s=0;s<L;s+=50){ acc++; const q=s/L; anchors.push({x:ax+(bx-ax)*q,y:ay+(by-ay)*q,zone:f.zone,id:f.id+'_'+acc}); } } }
  }
  rebuildFinds();
}
let tileBusy=false;
async function tileLoader(){
  if (mapMode!=='OSM'||tileBusy) return;
  const me=toLL(P.x,P.y), [cy,cx]=tileOf(me.lat,me.lon), now=Date.now(), cand=[];
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const ty=cy+dy,tx=cx+dx,k=ty+':'+tx,st=tiles[k];
    if(st==='ok'||st==='loading'||(st&&st.fail&&now-st.fail<30000)) continue;
    const lat=clamp(me.lat,ty*TLAT,(ty+1)*TLAT), lon=clamp(me.lon,tx*TLON,(tx+1)*TLON), [x1,y1]=toXY(lat,lon), d=Math.hypot(x1-P.x,y1-P.y);
    if(d<350) cand.push({ty,tx,k,d}); }
  if(!cand.length) return; cand.sort((a,b)=>a.d-b.d); const c=cand[0];
  tileBusy=true; tiles[c.k]='loading';
  try { addFeatures(await loadTile(c.ty,c.tx)); tiles[c.k]='ok'; } catch(e){ tiles[c.k]={fail:Date.now()}; }
  tileBusy=false;
}
setInterval(tileLoader,2500);
function demoCity(){
  let seed=1977; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647; const out=[], H=650, step=95;
  const river=[]; for(let x=-H;x<=H;x+=40) river.push([x,Math.sin(x/220)*90+x*0.25]);
  out.push({kind:'area',pts:river.map(([x,y])=>[x,y-22]).concat(river.map(([x,y])=>[x,y+22]).reverse()),zone:'ranta',id:'d-river'});
  const riverY=x=>Math.sin(x/220)*90+x*0.25; let i=0;
  for(let gx=-H;gx<H;gx+=step) for(let gy=-H;gy<H;gy+=step){ const x0=gx+6,y0=gy+6,x1=gx+step-6,y1=gy+step-6,cx=(x0+x1)/2,cy=(y0+y1)/2;
    if(Math.abs(cy-riverY(cx))<60) continue; const r=rnd(), rc=[[x0,y0],[x1,y0],[x1,y1],[x0,y1],[x0,y0]]; let z=null;
    if(r<0.18) z='puisto'; else if(r<0.28) z='teollinen';
    if(z) out.push({kind:'area',pts:rc,zone:z,id:'d'+(i++)});
    if(!z||z==='teollinen') for(let b=0;b<4;b++){ const bx=x0+8+rnd()*(step-40),by=y0+8+rnd()*(step-40),w=12+rnd()*16,h=12+rnd()*16; out.push({kind:'area',pts:[[bx,by],[bx+w,by],[bx+w,by+h],[bx,by+h],[bx,by]],cls:'building'}); } }
  for(let gx=-H;gx<=H;gx+=step){ const m=gx%(step*3)===0; out.push({kind:'line',pts:[[gx,-H],[gx,H]],cls:m?'road1':'road2',id:'dv'+gx,zone:m?null:'piha'}); out.push({kind:'line',pts:[[-H,gx],[H,gx]],cls:m?'road1':'road2',id:'dh'+gx,zone:m?null:'piha'}); }
  [[-180,-260,'arkisto'],[240,180,'arkisto'],[60,-90,'arkisto'],[380,-300,'verkko'],[-420,-60,'verkko'],[40,60,'verkko']].forEach(([x,y,z],k)=>out.push({kind:'point',x,y,zone:z,id:'dp'+k}));
  return out;
}

// ================= LÖYDÖT =================
// Maailma jaetaan 150 m soluihin. Osaan soluista syntyy päivittäin yksi löytö.
const CELL=150, CELL_P=0.16;
let finds=[];
function cellKey(x,y){ const ll=toLL(x,y); return Math.floor(ll.lat/0.00135)+':'+Math.floor(ll.lon/0.0027); }
function pickLoot(zone,r){ const L=ZONE_LOOT[zone]; let tot=L.reduce((a,b)=>a+b[3],0), q=r()*tot; for(const it of L){ q-=it[3]; if(q<=0) return it; } return L[0]; }
function rebuildFinds(){
  const day=today(), byCell={};
  for (const a of anchors){ const k=cellKey(a.x,a.y); (byCell[k]=byCell[k]||[]).push(a); }
  finds=[];
  for (const k in byCell){ const r=seeded(day+'|'+k); if (r()>CELL_P) continue;
    const list=byCell[k]; const a=list[(r()*list.length)|0]; const [kind,key,n]=pickLoot(a.zone,r);
    const id='f|'+day+'|'+k;
    if (S.found[id]) continue;
    finds.push({id,x:a.x,y:a.y,zone:a.zone,kind,key,n,mem:(r()*(MEMORIES.length-1))|0, cell:k});
  }
}

    const n=f.n+(isNew&&f.kind==='strain'?1:0);

function chime(big){ const t=AC.currentTime; (big?[523,659,784,1047]:[659,988]).forEach((fq,k)=>{ const o=AC.createOscillator(),gg=AC.createGain(); o.type='sine'; o.frequency.value=fq;
  gg.gain.setValueAtTime(0.0001,t+k*0.09); gg.gain.exponentialRampToValueAtTime(0.06,t+k*0.09+0.02); gg.gain.exponentialRampToValueAtTime(0.0001,t+k*0.09+0.8); o.connect(gg).connect(AC.destination); o.start(t+k*0.09); o.stop(t+k*0.09+0.85); }); }

let ROT=0, rotTarget=0, moveHeading=null, lastHeadPt=null, compassHeading=null, compassOn=false, dirMode='kulku';
function lerpAngle(a,b,t){ let d=((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI; return a+d*t; }
function updateHeading(dt){
  if(!lastHeadPt) lastHeadPt={x:P.x,y:P.y,t:performance.now()};
  const dx=P.x-lastHeadPt.x, dy=P.y-lastHeadPt.y;
  if(Math.hypot(dx,dy)>4){ moveHeading=Math.atan2(dx,-dy); lastHeadPt={x:P.x,y:P.y,t:performance.now()}; }
  const still=performance.now()-lastHeadPt.t>4000;
  if(dirMode==='pohjoinen') rotTarget=0;
  else if(dirMode==='kompassi'&&compassHeading!==null) rotTarget=compassHeading;
  else if(still&&compassOn&&compassHeading!==null) rotTarget=compassHeading;
  else if(moveHeading!==null) rotTarget=moveHeading;
  ROT=lerpAngle(ROT,rotTarget,Math.min(1,dt*2.2));

function onOri(e){ let h=null; if(typeof e.webkitCompassHeading==='number') h=e.webkitCompassHeading; else if(e.absolute&&e.alpha!=null) h=360-e.alpha;
  if(h!==null&&!isNaN(h)){ const r=h*Math.PI/180; compassHeading=compassHeading===null?r:lerpAngle(compassHeading,r,0.25); } }

const MAP_TOP=14; const mapH=()=>LH-MAP_TOP-62;

function scr(x,y){ const dx=(x-P.x)/mpp, dy=(y-P.y)/mpp, c=Math.cos(-ROT), s=Math.sin(-ROT); return [dx*c-dy*s+LW/2, dx*s+dy*c+CYm()]; }
function unscr(X,Y){ const u=(X-LW/2)*mpp, v=(Y-CYm())*mpp, c=Math.cos(ROT), s=Math.sin(ROT); return [P.x+u*c-v*s, P.y+u*s+v*c]; }

function drawMap(t){

      else if(Math.abs(d[i]-water[0])<6&&Math.abs(d[i+2]-water[2])<6){ if(((((wx/2)|0)+((wy/2)|0)*3+((t*2)|0))%11)===0){ d[i]=95; d[i+1]=199; d[i+2]=208; } }

    updateHeading(dt);
    // pitokeräys
    if(hold){ const d=Math.hypot(hold.f.x-P.x,hold.f.y-P.y); if(d>RANGE+5){ hold=null; } else { hold.p+=dt/2.4; if(hold.p>=1){ const f=hold.f; hold=null; collect(f); } } }
    audioTick(dt);
  }
  if(t-lastDraw>66){ lastDraw=t; render(t/1000); }
  requestAnimationFrame(loop);
}
function render(t){
  HIT=[];
  if(booting){ drawBoot(t); }
  else { drawMap(t); drawUI(t); drawModal(t); }
  sctx.imageSmoothingEnabled=false; sctx.drawImage(buf,0,0,LW,LH,0,0,cv.width,cv.height);
}

// ================= SYÖTE =================
const keys=new Set(); addEventListener('keydown',e=>keys.add(e.key)); addEventListener('keyup',e=>keys.delete(e.key));
let down=null, pinch=null;
const toL=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*LW, (e.clientY-r.top)/r.height*LH]; };
cv.addEventListener('pointerdown',e=>{
  if(booting) return;
  const [x,y]=toL(e); down={x,y,cx:e.clientX,cy:e.clientY};
  if(!modal && holdZone && y>=holdZone.y && y<holdZone.y+holdZone.h){ hold={f:holdZone.f,p:0}; if(!AC){ try{ initAudio(); sigOn=true; }catch(_){} } return; }
  for(let i=HIT.length-1;i>=0;i--){ const h=HIT[i]; if(x>=h.x&&x<h.x+h.w&&y>=h.y&&y<h.y+h.h){ h.fn(); down=null; return; } }
  if(modal){ down=null; }
});
const endHold=()=>{ if(hold&&hold.p<1){ hold=null; say('YHTEYS KATKESI. PIDÄ SORMI PAIKALLAAN, KUNNES SYKE TAHDISTUU.',UI.ui3); } };
cv.addEventListener('pointerup',e=>{ endHold(); if(!down) return; const mv=Math.hypot(e.clientX-down.cx,e.clientY-down.cy); const d=down; down=null;
  if(mv<8&&!pinch&&P.mode==='sim'&&d.y>MAP_TOP&&d.y<LH-62){ const [wx,wy]=unscr(d.x,d.y); P.tx=wx; P.ty=wy; } });
cv.addEventListener('pointercancel',endHold); cv.addEventListener('pointerleave',endHold);
cv.addEventListener('wheel',e=>{ e.preventDefault(); mpp=clamp(mpp*(e.deltaY<0?0.89:1.12),0.6,4); },{passive:false});
cv.addEventListener('touchstart',e=>{ if(e.touches.length===2){ const [a,b]=e.touches; pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),m:mpp}; hold=null; } },{passive:true});
cv.addEventListener('touchmove',e=>{ if(pinch&&e.touches.length===2){ const [a,b]=e.touches; mpp=clamp(pinch.m*pinch.d/Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),0.6,4); } },{passive:true});
cv.addEventListener('touchend',e=>{ if(e.touches.length<2) setTimeout(()=>pinch=null,50); },{passive:true});

// ================= GPS =================
const GEO_ERR={1:'LUPA EVÄTTY',2:'SIJAINTI EI SAATAVILLA',3:'AIKAKATKAISU'};
let geoErr='';
function getPosition(){ return new Promise(res=>{
  if(!window.isSecureContext){ geoErr='EI HTTPS'; return res(null); }
  if(!navigator.geolocation){ geoErr='EI TUKEA'; return res(null); }
  let done=false; const fin=v=>{ if(!done){ done=true; clearTimeout(to); res(v); } };
  const to=setTimeout(()=>{ geoErr=geoErr||GEO_ERR[3]; fin(null); },25000);
  const once=(hi,next)=>{ try{ navigator.geolocation.getCurrentPosition(p=>fin(p),e=>{ geoErr=GEO_ERR[e.code]||('VIRHE '+e.code); if(e.code===1) fin(null); else next(); },{enableHighAccuracy:hi,timeout:12000,maximumAge:60000}); }catch(e){ geoErr='VIRHE'; fin(null); } };
  once(true,()=>once(false,()=>fin(null)));
}); }
let watchId=null;
function startWatch(){
  if(!navigator.geolocation||!window.isSecureContext||watchId!==null) return;
  watchId=navigator.geolocation.watchPosition(p=>{
    const [x,y]=toXY(p.coords.latitude,p.coords.longitude), now=Date.now();
    if(P.mode!=='gps'){ P.mode='gps'; P.tx=P.ty=null; lastFix=null; say('GPS-LUKITUS SAATU.'); if(Math.hypot(x,y)>2500) say('GPS LÖYTYI KAUKAA. LATAA SIVU UUDELLEEN.',UI.ui3); }
    if(lastFix){ const d=Math.hypot(x-lastFix.x,y-lastFix.y), sp=d/Math.max(1,(now-lastFix.t)/1000);
      if(sp>50) return; if(sp<7) moved(d); }
    lastFix={x,y,t:now}; P.x=x; P.y=y;
  },()=>{},{enableHighAccuracy:true,maximumAge:2000,timeout:30000});
}
async function retryMap(){
  say('HAETAAN KARTTAA...',UI.ui3); const here=toLL(P.x,P.y);
  try{ origin={lat:here.lat,lon:here.lon}; P.x=0; P.y=0; lastFix=null; P.tx=P.ty=null;
    for(const k in tiles) delete tiles[k]; seenOSM=new Set();
    const [ty,tx]=tileOf(origin.lat,origin.lon); const f=await loadTile(ty,tx); if(f.length<5) throw new Error('LIIAN VÄHÄN DATAA');
    tiles[ty+':'+tx]='ok'; features=[]; anchors=[]; mapMode='OSM'; addFeatures(f); say('OIKEA KARTTA LADATTU.'); }
  catch(e){ say('KARTTA EPÄONNISTUI: '+e.message,UI.ui3); }
}

async function boot(){
  bootSay('SYMBIONTTIYHTEYS'); bootSay('...KUULETKO MEITÄ? ME KUULEMME SINUT.'); bootSay('');
  bootSay('> HAETAAN SIJAINTIA...');
  const qs=new URLSearchParams(location.search);
  const pos = qs.has('sim') ? null : await getPosition();
  if(pos){ origin={lat:pos.coords.latitude,lon:pos.coords.longitude}; P.mode='gps'; bootSay('  GPS OK'); }
  else { origin={...START}; P.mode='sim'; bootSay('  EI GPS: '+(geoErr||'SIMULOITU')); bootSay('  > TURKU, KAUPPATORI (SIMULOITU)'); }
  bootSay('> LADATAAN KARTTAA...');
  let f=[];
  if(qs.has('demo')) { f=demoCity(); mapMode='DEMO'; }
  else try{ const [ty,tx]=tileOf(origin.lat,origin.lon); tiles[ty+':'+tx]='loading'; f=await loadTile(ty,tx); tiles[ty+':'+tx]='ok'; if(f.length<5) throw new Error('LIIAN VÄHÄN DATAA'); bootSay('  '+f.length+' KOHDETTA'); }
  catch(e){ f=demoCity(); mapMode='DEMO'; bootSay('  KARTTA EPÄONNISTUI'); bootSay('  > DEMOKAUPUNKI'); }
  addFeatures(f);
  startWatch();
  bootSay(''); bootSay('> VALMIS.');
  await new Promise(r=>setTimeout(r,700));
  booting=false;
  say(P.mode==='sim'?'TESTITILA: NAPAUTA KARTTAA KÄVELLÄKSESI.':'OLET ULKONA. KÄVELE, NIIN SYKE HERÄÄ.');
}
boot();
requestAnimationFrame(loop);
window.DBG={P, get finds(){return finds}, get S(){return S}, collect, get anchors(){return anchors}};
})();
</script>

<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PROTO-01 – Turun rihmasto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#ffb000; --amber-dim:rgba(255,176,0,.55); --bg:#0a0603;
    --magenta:#ff2bd6; --cyan:#3ee8ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--amber);
    font-family:'VT323',ui-monospace,monospace;font-size:20px;overflow:hidden;
    text-shadow:0 0 4px rgba(255,176,0,.7)}
  #map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  /* CRT-kerrokset */
  .crt::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.28) 3px,rgba(0,0,0,0) 4px)}
  .crt::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%);
    animation:flicker 4s infinite steps(1)}
  @keyframes flicker{0%{opacity:.95}7%{opacity:.88}8%{opacity:.97}50%{opacity:.93}51%{opacity:.98}}
  .panel{position:fixed;left:10px;right:10px;z-index:20;background:rgba(10,6,3,.88);
    border:1px solid var(--amber-dim);box-shadow:0 0 12px rgba(255,176,0,.25) inset;padding:8px 12px}
  #top{top:calc(10px + env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;font-size:17px;flex-wrap:wrap}
  #bottom{bottom:calc(10px + env(safe-area-inset-bottom))}
  #zone{min-height:26px;font-size:21px}
  #zone .sub{font-size:17px;opacity:.75}
  #log{font-size:16px;opacity:.8;height:58px;overflow:hidden;margin-top:4px;white-space:pre-line}
  .row{display:flex;gap:8px;margin-top:8px}
  button{flex:1;font-family:inherit;font-size:20px;white-space:nowrap;background:transparent;color:var(--amber);
    border:1px solid var(--amber);padding:6px 4px;text-shadow:inherit;cursor:pointer;letter-spacing:1px}
  button:active{background:rgba(255,176,0,.18)}
  button:disabled{opacity:.35;cursor:default}
  button.hot{color:var(--magenta);border-color:var(--magenta);text-shadow:0 0 5px var(--magenta)}
  #modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
  #modal .box{width:min(92vw,460px);max-height:78vh;overflow:auto;background:var(--bg);border:1px solid var(--amber);padding:14px 16px;box-shadow:0 0 18px rgba(255,176,0,.3)}
  #modal h2{margin:0 0 8px;font-weight:normal;font-size:26px}
  .bar{height:10px;border:1px solid var(--amber-dim);margin:2px 0 8px}
  .bar i{display:block;height:100%;background:var(--amber);box-shadow:0 0 6px var(--amber)}
  .line{display:flex;justify-content:space-between}
  .blink{animation:blink 1s infinite steps(1)}
  @keyframes blink{50%{opacity:0}}
  #boot{position:fixed;inset:0;z-index:60;background:var(--bg);padding:24px;font-size:20px;white-space:pre-line}
  .hint{font-size:15px;opacity:.6}
  #mg{position:fixed;inset:0;z-index:42;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);touch-action:none;user-select:none;-webkit-user-select:none}
  .mgbox{width:min(90vw,380px);background:rgba(10,6,3,.96);border:2px solid var(--c);box-shadow:0 0 22px var(--c);padding:16px;text-align:center}
  #mg-track{position:relative;height:34px;border:1px solid var(--amber-dim);margin:16px 0 8px;background:repeating-linear-gradient(90deg,rgba(255,176,0,.06) 0 6px,transparent 6px 12px)}
  #mg-tgt{position:absolute;top:0;bottom:0;background:var(--c);opacity:.35;box-shadow:0 0 10px var(--c)}
  #mg-cur{position:absolute;left:0;top:-6px;bottom:-6px;width:3px;margin-left:-1px;will-change:transform;background:#fff;box-shadow:0 0 8px #fff}
  #mg-fb{height:28px;font-size:26px}
  #mg-dots{display:flex;gap:10px;justify-content:center;margin:4px 0 8px}
  .dot{width:14px;height:14px;border:1px solid var(--amber)} .dot.hit{background:#9cff57;border-color:#9cff57;box-shadow:0 0 6px #9cff57} .dot.miss{background:#ff6a5a;border-color:#ff6a5a}
  .sigbtn{flex:none;font-size:16px;padding:2px 8px}
  .sigbtn.on{background:rgba(255,176,0,.22)}
  #sig{display:flex;justify-content:space-between;font-size:17px;opacity:.9;margin-bottom:2px}
  #sig-bar{letter-spacing:1px}
  #modal-box button.on{background:rgba(255,176,0,.22)}
  #modal .box{overflow-x:hidden;box-sizing:border-box}
  #modal-box .row button{font-size:16px;padding:6px 2px;min-width:0;white-space:normal}
  #modal-box .line{gap:6px;flex-wrap:wrap}
  #modal-box .r{font-size:16px}
  .mach{border:1px solid var(--amber-dim);padding:8px 10px;margin:8px 0}
  .mach .t{display:flex;justify-content:space-between;font-size:22px}
  .mach .r{font-size:17px;opacity:.85}
  .mach .row button{font-size:18px;padding:4px}
  .ok{color:#9cff57;text-shadow:0 0 5px #9cff57} .no{color:#ff6a5a;text-shadow:0 0 5px #ff6a5a}
  #loot{position:fixed;left:50%;top:38%;z-index:45;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;
    width:min(80vw,320px);background:rgba(10,6,3,.95);border:2px solid var(--c,#ffb000);padding:14px 16px;text-align:center;
    box-shadow:0 0 24px var(--c,#ffb000),0 0 4px var(--c,#ffb000) inset;transition:transform .18s cubic-bezier(.2,1.6,.4,1),opacity .18s}
  #loot.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  #loot .rar{font-size:16px;letter-spacing:3px;color:var(--c);text-shadow:0 0 6px var(--c)}
  #loot .icon{font-size:44px;line-height:1.1;color:var(--c);text-shadow:0 0 10px var(--c);margin:4px 0}
  #loot .name{font-size:28px}
  #loot .xp{font-size:18px;opacity:.8;margin-top:4px}
  #loot.rare{animation:glitch .5s steps(2) 2}
  @keyframes glitch{0%{transform:translate(-50%,-50%) translate(2px,-1px)}50%{transform:translate(-50%,-50%) translate(-2px,1px)}100%{transform:translate(-50%,-50%)}}
  .float{position:fixed;z-index:30;pointer-events:none;font-size:22px;transform:translate(-50%,0);animation:floatup 1.4s ease-out forwards}
  @keyframes floatup{to{transform:translate(-50%,-60px);opacity:0}}
  #flash{position:fixed;inset:0;z-index:44;pointer-events:none;opacity:0;background:var(--c,#ffb000)}
  #flash.on{animation:flash .35s ease-out}
  @keyframes flash{0%{opacity:.22}100%{opacity:0}}
</style>
</head>
<body class="crt">
<canvas id="map"></canvas>

<div id="top" class="panel">
  <span id="st-pos">SIJAINTI: ...</span>
  <span id="st-data">DATA: ...</span>
  <button id="b-sig" class="sigbtn">SYKE: POIS</button>
  <button id="b-dir" class="sigbtn">SUUNTA: KULKU</button>
  <button id="b-map" class="sigbtn" style="display:none;color:#ff2bd6;border-color:#ff2bd6">HAE KARTTA</button>
  <span class="hint">v2.0</span>
  <span id="st-xp">LÖYDÖT 0</span>
</div>

<div id="bottom" class="panel">
  <div id="sig"><span>SYKE</span><span id="sig-bar">▯▯▯▯▯▯▯▯▯▯</span></div>
  <div id="zone">Tutki ympäristöä<span class="blink">_</span></div>
  <div id="log"></div>
  <div class="row">
    <button id="btn-gather" disabled>—</button>
    <button id="btn-inv">REPPU</button>
    <button id="btn-base">SOLMU</button>
    <button id="btn-skills">LÖYDÖT</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<div id="modal"><div class="box" id="modal-box"></div></div>
<div id="mg"><div class="mgbox">
  <div id="mg-title" style="font-size:26px;color:var(--c);text-shadow:0 0 6px var(--c)"></div>
  <div id="mg-desc" class="hint" style="opacity:.8"></div>
  <div id="mg-track"><div id="mg-tgt"></div><div id="mg-cur"></div></div>
  <div id="mg-fb"></div>
  <div id="mg-dots"></div>
  <div class="hint">Napauta mihin tahansa · 3 yritystä</div>
</div></div>
<div id="loot"></div>
<div id="flash"></div>
<div id="boot"></div>

<script>
(() => {
'use strict';

// ---------- Pelin data ----------
const START = { lat: 60.4518, lon: 22.2666 }; // Turun kauppatori
const RADIUS = 500; // metriä, karttadatan hakusäde
const ZONES = {
  lataus:   { name:'ELÄVÄ TASKU',      color:'#3ee8ff', desc:'Vanhan verkon osa, joka vielä elää. Rihmavirtaa riittää kennoille.',
              loot:[] },
  romu:     { name:'RUOSTEKENTTÄ',     color:'#ffb000', desc:'Vanhan maailman metallia. Sienten ravintoa.',
              loot:[['Metalliravinne',75,2,3],['Kalkkiitti',25,1,2]] },
  kaapeli:  { name:'KAAPELIKAIVO',     color:'#ff9a3c', desc:'Katujen alla kuolleen verkon kuparia ja betonipölyä.',
              loot:[['Kupariravinne',60,1,3],['Kalkkiitti',40,1,2]] },
  rihmasto: { name:'VILLI KASVUSTO',   color:'#9cff57', desc:'Uutta, villiä rihmastoa. Ota näyte kannasta.',
              loot:[['Rihmastomassa',100,1,2]] },
  ranta:    { name:'KOSTEIKKO',        color:'#5fd0ff', desc:'Vettä ja levää. Tislauksen raaka-aineita.',
              loot:[['Vesi',55,1,3],['Levä',45,1,2]] },
  arkisto:  { name:'MUISTIPESÄ',       color:'#c38bff', desc:'Rihmasto kasvoi aikoinaan palvelimiin. Se muistaa vielä.',
              loot:[['Muistikudos',75,1,2],['Muistisolu',25,1,1]] },
  hot:      { name:'KUIHTUMA-ALUE',    color:'#ff2bd6', desc:'Täällä kuihtuminen jatkuu. Vaarallinen, mutta muistoja on paljon.', hot:true,
              loot:[['Kuihtumanäyte',60,1,2],['Muistisolu',40,1,1]] },
  markkina: { name:'MARKKINAPAIKKA',   color:'#ffffff', desc:'Kaupankäynti avautuu myöhemmässä versiossa.', loot:[] }
};
const SKILLS = {
  romu:{n:'Romunkeruu'}, metsa:{n:'Metsästys'}, kala:{n:'Kalastus'}, viljely:{n:'Viljely'},
  hakk:{n:'Hakkerointi'}, tyosto:{n:'Työstö'}, kartoitus:{n:'Kartoitus'}, kestavyys:{n:'Kestävyys'}
};
const ICONS={Metalliravinne:'⚙',Kupariravinne:'〰',Levä:'≋',Muistikudos:'✺',Muistisolu:'✦',Kuihtumanäyte:'☣',Pesäke:'⌂',Kaivinsieni:'⚒',Keskittymisuute:'⚗',Virtasieni:'⚡','Puhdas vesi':'≈',Syövytin:'◆',Kitiini:'⬢',Kondensaattori:'⊣',Servo:'⚙',Kuparilanka:'〰',Kalkkiitti:'▤',Valokuitu:'⌇',Rihmastomassa:'❦',Jäähdytysneste:'≈',Datasedimentti:'◫',Signaalikide:'◇',Taajuusmoduuli:'▣',Johdin:'⌁',Piirilevy:'▦','Puhdas data':'▧',Ohjelma:'⌘','Tyhjä kenno':'▯','Ladattu kenno':'▮',Bioakku:'⚡',Metalliitti:'◆',Neurokudos:'✺',Kitiinilevy:'⬢',Valosieni:'✧',Romumetalli:'⚙',Koneenosa:'🔩','Vanha piirilevy':'▦',Puu:'♣',Yrtti:'❦',Riista:'☠',Vesi:'≈',Kala:'⋊',Mutanttiankerias:'∿',Vilja:'⁂',Juurekset:'◆',Datafragmentti:'◫','Resepti: suodatin':'✎','Salattu ydin':'◉',Energiakenno:'⚡','Harvinainen piiri':'▣','Tekoälyn sirpale':'✦',Metallilevy:'▭',Romusorkka:'⚒'};
const RARITY=[['TAVALLINEN','#ffb000'],['EPÄTAVALLINEN','#3ee8ff'],['HARVINAINEN','#ff2bd6']];
const COOLDOWN_MS = 45000;   // proto: resurssipiste palautuu 45 s
const ZONE_PRIO = ['hot','lataus','arkisto','markkina','ranta','romu','kaapeli','rihmasto'];

// ---------- Tila ----------
const SAVE_KEY = 'proto01_save_v3';
let S = { xp:{}, inv:{}, visited:{}, cooldowns:{}, walked:0, walkedToday:0, day:'', base:null, equip:null };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) S = Object.assign(S, s); } catch(e){}
for (const k in SKILLS) S.xp[k] = S.xp[k] || 0;
const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} };

const level = xp => Math.min(99, Math.floor(1 + Math.sqrt(xp / 20)));
const xpFor = l => 20 * (l - 1) * (l - 1);
const totalLevel = () => Object.keys(SKILLS).reduce((a,k)=>a+level(S.xp[k]),0);

// ---------- Projektio (metrit origosta) ----------
let origin = { ...START };
const kx = () => Math.cos(origin.lat * Math.PI/180) * 111320;
const toXY = (lat, lon) => [ (lon - origin.lon) * kx(), -(lat - origin.lat) * 110540 ];
const toLL = (x, y) => ({ lat: origin.lat - y/110540, lon: origin.lon + x/kx() });

// ---------- Karttaominaisuudet ----------
// area: {kind:'area', pts, zone?, cls}   line: {kind:'line', pts, cls}   point: {kind:'point', x,y,r, zone}
let features = [];
let zoneFeatures = [];

function classify(t){
  if (!t) return null;
  if (t.power==='substation'||t.power==='transformer') return 'lataus';
  if (t.power==='plant'||t.man_made==='mast'||t.man_made==='communications_tower'||(t.man_made==='tower'&&t['tower:type']==='communication')) return 'hot';
  if (['library','school','university','college'].includes(t.amenity)) return 'arkisto';
  if (t.shop==='mall'||t.landuse==='retail') return 'markkina';
  if (t.natural==='water'||t.waterway==='riverbank') return 'ranta';
  if (t.landuse==='industrial') return 'romu';
  if (t.landuse==='forest'||t.landuse==='farmland'||t.natural==='wood'||t.natural==='scrub'||t.leisure==='park'||t.leisure==='garden'||t.landuse==='meadow'||t.landuse==='grass') return 'rihmasto';
  return null;
}

let osmNote='', bootSay=null, osmFail='';
const SERVERS = ['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
async function overpass(q, label){
  const errs=[];
  for (const url of SERVERS){
    const host=url.split('/')[2];
    for (let attempt=0; attempt<2; attempt++){
      const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 30000);
      try {
        bootSay && bootSay(`  ${label}: ${host}${attempt?' (uusi yritys)':''} ...`);
        const res = await fetch(url, { method:'POST', body:'data='+encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}, signal:ctrl.signal });
        clearTimeout(to);
        if (res.ok){ const js = await res.json(); osmNote = host; return js; }
        errs.push(host+': HTTP '+res.status);
        if ([429,502,503,504].includes(res.status) && attempt===0){ await new Promise(r=>setTimeout(r,2500)); continue; }
        break;
      } catch(e){ clearTimeout(to); errs.push(host+': '+(e.name==='AbortError'?'aikakatkaisu':e.message)); break; }
    }
  }
  throw new Error(errs.join(' | '));
}
// ---------- Karttaruudut: aluetta ladataan lisää liikkuessa ----------
const TLAT=0.005, TLON=0.010;           // n. 550 m × 550 m Turun leveysasteella
const tiles={}; let seenOSM=new Set(), mapMode='OSM';
const tileOf=(lat,lon)=>[Math.floor(lat/TLAT), Math.floor(lon/TLON)];
function parseOSM(els){
  const out=[];
  for (const el of els){
    const uid=el.type[0]+el.id; if (seenOSM.has(uid)) continue; seenOSM.add(uid);
    const t = el.tags || {}; const z = classify(t);
    if (el.type==='node' || el.center){
      if (z){ const c = el.center || el; const [x,y]=toXY(c.lat,c.lon); out.push({kind:'point',x,y,r: z==='hot'?60:z==='lataus'?30:45,zone:z,id:uid}); }
      continue;
    }
    const geom = el.geometry; if (!geom || geom.length<2) continue;
    const pts = geom.map(g=>toXY(g.lat,g.lon));
    const closed = pts.length>3 && geom[0].lat===geom[geom.length-1].lat && geom[0].lon===geom[geom.length-1].lon;
    if (t.highway){ out.push({kind:'line',pts,cls: /primary|secondary|trunk|tertiary/.test(t.highway)?'road1':'road2', id:uid, residential:/residential|living_street|service|unclassified/.test(t.highway)}); continue; }
    if (t.waterway && !closed){ out.push({kind:'line',pts,cls:'water',zone:'ranta',id:uid,w:25}); continue; }
    if (t.building){ out.push({kind:'area',pts,cls:'building'}); continue; }
    if (z && closed && z!=='hot' && z!=='arkisto' && z!=='lataus') out.push({kind:'area',pts,zone:z,id:uid});
  }
  return out;
}
async function loadTile(ty,tx){
  const s_=ty*TLAT, w_=tx*TLON, bb=`${s_.toFixed(5)},${w_.toFixed(5)},${(s_+TLAT).toFixed(5)},${(w_+TLON).toFixed(5)}`;
  const qMain = `[out:json][timeout:25][bbox:${bb}];
(way["highway"~"^(primary|secondary|tertiary|residential|unclassified|living_street|pedestrian|service|footway|cycleway|path)$"];
 way["landuse"~"^(industrial|forest|farmland|meadow|grass|retail)$"];
 way["natural"~"^(wood|water|scrub)$"];
 way["leisure"~"^(park|garden)$"];
 way["waterway"~"^(river|stream|canal)$"];);
out geom qt;
(nwr["amenity"~"^(library|school|university|college)$"];
 nwr["power"~"^(substation|plant|transformer)$"];
 nwr["man_made"~"^(mast|tower|communications_tower)$"];
 nwr["shop"="mall"];);
out center qt;`;
  const qBld = `[out:json][timeout:25][bbox:${bb}];way["building"];out geom qt;`;
  const ck='osmt_'+ty+'_'+tx; let main=null, bld=null;
  try { const c=JSON.parse(localStorage.getItem(ck)); if (c && Date.now()-c.t<7*864e5){ main=c.m; bld=c.b; osmNote='välimuistista'; } } catch(e){}
  if (!main){
    main = await overpass(qMain, 'kartta');
    try { bld = await overpass(qBld, 'rakennukset'); } catch(e){ bld={elements:[]}; }
    try { localStorage.setItem(ck, JSON.stringify({t:Date.now(), m:main, b:bld})); }
    catch(e){ try { for (const k of Object.keys(localStorage)) if (k.startsWith('osmt_')) localStorage.removeItem(k); localStorage.setItem(ck, JSON.stringify({t:Date.now(), m:main, b:bld})); } catch(e2){} }
  }
  return parseOSM(main.elements.concat(bld.elements));
}
function addFeatures(nf){
  features.push(...nf);
  const nz = nf.filter(f=>f.zone && f.id); zoneFeatures.push(...nz);
  const have = new Set(nodes.map(n=>n.id)); nodes.push(...genNodes(nz.concat(nf.filter(f=>f.residential))).filter(n=>!have.has(n.id)));
}
// taustalataaja: hakee viereiset ruudut, kun pelaaja lähestyy ladatun alueen reunaa
let tileBusy=false;
async function tileLoader(){
  if (mapMode!=='OSM' || tileBusy) return;
  const me=toLL(P.x,P.y); const [cy,cx]=tileOf(me.lat,me.lon); const now=Date.now();
  const cand=[];
  for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++){
    const ty=cy+dy, tx=cx+dx, k=ty+':'+tx, st=tiles[k];
    if (st==='ok' || st==='loading' || (st && st.fail && now-st.fail<30000)) continue;
    const lat=Math.min(Math.max(me.lat,ty*TLAT),(ty+1)*TLAT), lon=Math.min(Math.max(me.lon,tx*TLON),(tx+1)*TLON);
    const [x1,y1]=toXY(lat,lon), d=Math.hypot(x1-P.x,y1-P.y);
    if (d<350) cand.push({ty,tx,k,d});
  }
  if (!cand.length) return;
  cand.sort((a,b)=>a.d-b.d); const c=cand[0];
  tileBusy=true; tiles[c.k]='loading';
  const showMsg = c.d < 120;  // kerrotaan vain, jos reuna on jo lähellä
  if (showMsg) log('Ladataan lisää aluetta...');
  try { const nf=await loadTile(c.ty,c.tx); addFeatures(nf); tiles[c.k]='ok'; if (showMsg) log('Uusi alue ladattu.'); }
  catch(e){ tiles[c.k]={fail:Date.now()}; if (showMsg) log('Alueen lataus epäonnistui, yritetään uudelleen...'); }
  tileBusy=false;
}
setInterval(tileLoader, 2500);
async function loadStartArea(lat,lon){
  const [ty,tx]=tileOf(lat,lon); tiles[ty+':'+tx]='loading';
  try { const f=await loadTile(ty,tx); tiles[ty+':'+tx]='ok'; return f; } catch(e){ delete tiles[ty+':'+tx]; throw e; }
}

// ---------- Proseduraalinen demokaupunki (jos OSM ei ole saatavilla) ----------
function demoCity(){
  let seed = 1977; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const out = []; const H = 650, step = 95;
  // joki
  const river = []; for (let x=-H; x<=H; x+=40) river.push([x, Math.sin(x/220)*90 + x*0.25]);
  const top = river.map(([x,y])=>[x,y-22]), bot = river.map(([x,y])=>[x,y+22]).reverse();
  out.push({kind:'area',pts:top.concat(bot),zone:'ranta',id:'d-river'});
  const riverY = x => Math.sin(x/220)*90 + x*0.25;
  // korttelit
  let i=0;
  for (let gx=-H; gx<H; gx+=step) for (let gy=-H; gy<H; gy+=step){
    const x0=gx+6, y0=gy+6, x1=gx+step-6, y1=gy+step-6, cx=(x0+x1)/2, cy=(y0+y1)/2;
    if (Math.abs(cy - riverY(cx)) < 60) continue;
    const r = rnd(); const rect=[[x0,y0],[x1,y0],[x1,y1],[x0,y1],[x0,y0]];
    const d = Math.hypot(cx,cy);
    let z = null;
    if (r<0.18) z='rihmasto'; else if (r<0.30) z='romu'; else if (r<0.34) z='markkina';
    if (z) out.push({kind:'area',pts:rect,zone:z,id:'d'+(i++)});
    if (!z || z==='markkina' || z==='romu'){
      for (let b=0;b<4;b++){ const bx=x0+8+rnd()*(step-40), by=y0+8+rnd()*(step-40), w=12+rnd()*16, h=12+rnd()*16;
        out.push({kind:'area',pts:[[bx,by],[bx+w,by],[bx+w,by+h],[bx,by+h],[bx,by]],cls:'building'}); }
    }
  }
  for (let gx=-H; gx<=H; gx+=step){ const main=gx%(step*3)===0; out.push({kind:'line',pts:[[gx,-H],[gx,H]],cls: main?'road1':'road2',id:'dv'+gx,residential:!main}); out.push({kind:'line',pts:[[-H,gx],[H,gx]],cls: main?'road1':'road2',id:'dh'+gx,residential:!main}); }
  const pts = [[ -180,-260,'arkisto'],[240,180,'arkisto'],[-330,310,'arkisto'],[60,-90,'arkisto'],[380,-300,'hot'],[-420,-60,'hot'],[150,420,'hot'],[40,60,'lataus'],[-120,140,'lataus'],[200,-160,'lataus'],[-300,-200,'lataus'],[330,330,'lataus']];
  pts.forEach(([x,y,z],k)=>out.push({kind:'point',x,y,r: z==='hot'?60:z==='lataus'?30:45,zone:z,id:'dp'+k}));
  return out;
}

// ---------- Geometria ----------
function inPoly(x,y,pts){ let c=false; for (let i=0,j=pts.length-1;i<pts.length;j=i++){ const [xi,yi]=pts[i],[xj,yj]=pts[j];
  if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; }
function distSeg(px,py,[ax,ay],[bx,by]){ const dx=bx-ax, dy=by-ay, l=dx*dx+dy*dy; let t=l?((px-ax)*dx+(py-ay)*dy)/l:0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy)); }
function zoneAt(x,y){
  const hits=[];
  for (const f of zoneFeatures){
    if (f.kind==='point'){ if (Math.hypot(x-f.x,y-f.y)<=f.r) hits.push(f); }
    else if (f.kind==='area'){ if (inPoly(x,y,f.pts)) hits.push(f); }
    else if (f.kind==='line'){ for (let i=1;i<f.pts.length;i++) if (distSeg(x,y,f.pts[i-1],f.pts[i])<=f.w){ hits.push(f); break; } }
  }
  hits.sort((a,b)=>ZONE_PRIO.indexOf(a.zone)-ZONE_PRIO.indexOf(b.zone));
  return hits[0]||null;
}

function moved(dist){

  // kartoitus: n. 40 m ruudut

}

function solmuAction(act, id, extra){
  const s=SM();
  if (act==='craft'){ const R=RECIPES.find(r=>r.id===id); if (!R) return;
    if (!hasStore(R.inp) || s.virta<R.virta){ log('Ei tarpeeksi raaka-aineita tai virtaa Solmussa.'); return; }
    if (R.id==='valo' && s.valo>=3){ log('Valosieniä on jo 3.'); return; }
    if (R.id==='kitiini' && s.kitiini>=2){ log('Kitiinireppu on jo täysi.'); return; }
    payStore(R.inp); s.virta-=R.virta;
    if (R.id==='kenno') S.carry.empty++;
    if (R.id==='pesake') S.inv['Pesäke']=(S.inv['Pesäke']||0)+1;
    if (R.id==='allas') s.kammiot.push(null);
    if (R.id==='kaivin') S.inv['Kaivinsieni']=(S.inv['Kaivinsieni']||0)+1;
    if (R.id==='uute') S.inv['Keskittymisuute']=(S.inv['Keskittymisuute']||0)+1;
    if (R.id==='virtas'){ s.bio++; s.bioT=Date.now(); }
    if (R.id==='valo') s.valo++;
    if (R.id==='kitiini') s.kitiini++;
    showLoot('',ICONS[R.name]||'❦',R.name,R.to==='reppu'?'Symbiontti kantaa sen reppuusi.':R.desc,'#9cff57',false,'VALMIS');
  }
  if (act==='plant'){ const kI=+extra, st=s.strains[+id]; if (!st || s.kammiot[kI]) return;
    if ((s.store.Kalkkiitti||0)<1 || s.virta<1){ log('Istutus vaatii 1 kalkkiitin ja 1 virran.'); return; }
    s.store.Kalkkiitti--; s.virta--; s.strains.splice(+id,1);
    s.kammiot[kI] = { st, start:Date.now(), dur: growTime(st) }; log(`${st.sp}-kanta istutettu.`);
  }
  if (act==='harvest'){ const kI=+id, c=s.kammiot[kI]; if (!c || Date.now()-c.start < c.dur) return;
    const sp=SPECIALS[c.st.sp], n=(sp.n||1)*c.st.s, mass=1+Math.floor(c.st.s/2);
    s.store[sp.item]=(s.store[sp.item]||0)+n; s.store.Rihmastomassa=(s.store.Rihmastomassa||0)+mass;
    showLoot('',ICONS[sp.item]||'❦',`${sp.item} ×${n}`,`+${mass} rihmastomassaa · ${c.st.sp}-kanta`,sp.color,!!sp.hybrid,'SATO');
    if ((s.store.Kalkkiitti||0)>=1 && s.virta>=1){ s.store.Kalkkiitti--; s.virta--; c.start=Date.now(); c.dur=growTime(c.st); }
    else { s.strains.push(c.st); s.kammiot[kI]=null; log('Ei alustaa uuteen kierrokseen – kanta palautettiin kantavarastoon.'); }
  }
  if (act==='uproot'){ const kI=+id, c=s.kammiot[kI]; if (!c) return; s.strains.push(c.st); s.kammiot[kI]=null; }
  if (act==='pick'){ crossPick = crossPick.includes(+id) ? crossPick.filter(x=>x!==+id) : crossPick.concat(+id).slice(-2); }
  if (act==='cross'){ crossbreed(); }
  if (act==='feed'){ if ((s.store.Muistisolu||0)<1) return; s.store.Muistisolu--; s.mem++;
    const txt = MEMORIES[Math.min(s.mem-1, MEMORIES.length-1)] + (s.mem>MEMORIES.length?' (muisto toistuu – lisää muistoja tulossa)':'');
    showLoot('','✦','Muisto palasi',txt,'#c38bff',true,'SYMBIONTTI'); }
  if (act==='tab'){ baseTab=id; }
  save(); renderBase(true);
}
const growTime = st => (TEST_SPEED ? 40000 : 4*3600000) * (1.5 - st.k*0.2);
function rnd15(v){ return Math.max(1, Math.min(5, v)); }
let crossPick=[];
function crossbreed(){
  const s=SM(); if (crossPick.length<2) return; if (s.virta<3){ log('Risteytys vaatii 3 virtaa.'); return; }
  const [a,b]=crossPick.map(i=>s.strains[i]); if (!a||!b) return;
  s.virta-=3;
  const mut = v => Math.random()<0.10 ? rnd15(v + (Math.random()<0.5?-1:1)) : v;
  const child = { k:mut(Math.random()<.5?a.k:b.k), s:mut(Math.random()<.5?a.s:b.s), si:mut(Math.random()<.5?a.si:b.si), sp:(Math.random()<.5?a.sp:b.sp), from:'Risteytys' };
  const key=[a.sp,b.sp].sort().join('+');
  if (HYBRIDS[key] && Math.random()<0.15) child.sp=HYBRIDS[key];
  const isNew = !s.book[child.sp]; s.book[child.sp]=1;
  if (s.strains.length>=8) s.strains.shift(); s.strains.push(child); crossPick=[];
  const sp=SPECIALS[child.sp];
  showLoot('','❦',`${child.sp}-kanta`,`Kasvu ${child.k} · Saanto ${child.s} · Sitkeys ${child.si}${isNew?' · UUSI KANTAKIRJAAN':''}`, sp.color, !!sp.hybrid, sp.hybrid?'HYBRIDI!':'RISTEYTYS');
}
function specialAt(x,y,seedId){
  let best=null, bd=250;
  const consider=(d,sp)=>{ if (d<bd){ bd=d; best=sp; } };
  for (const f of features){
    if (f.kind==='point'){ const d=Math.hypot(f.x-x,f.y-y);
      if (f.zone==='lataus') consider(d,'Johtava'); else if (f.zone==='arkisto') consider(d,'Muistava'); else if (f.zone==='hot') consider(d,'Hehkuva'); }
    else if (f.zone==='romu' || f.zone==='ranta'){ let d=1e9; for (let i=0;i<f.pts.length;i+=Math.max(1,Math.floor(f.pts.length/12))) d=Math.min(d,Math.hypot(f.pts[i][0]-x,f.pts[i][1]-y));
      consider(d+40, f.zone==='romu'?'Syövyttävä':'Suodattava'); }
  }
  if (best) return best;
  let b=0; for (const f of features) if (f.cls==='building' && Math.hypot(f.pts[0][0]-x,f.pts[0][1]-y)<150) b++;
  if (b>=6) return 'Kitiininen';
  const opts=['Johtava','Suodattava','Syövyttävä','Muistava','Kitiininen','Hehkuva']; return opts[Math.floor(seeded(seedId)()*6)];
}
function sampleStrain(node,hits){
  const r=seeded(node.id+'s'); const tr=()=>1+Math.floor(r()*3);
  const st={ sp:specialAt(node.x,node.y,node.id), k:tr(), s:tr(), si:tr(), from:NODE[node.zone].name };
  if (hits>=3){ const keys=['k','s','si']; const k=keys[Math.floor(Math.random()*3)]; st[k]=rnd15(st[k]+1); }
  S.carry.samples.push({st, t:Date.now()}); const isNew=!SM().book[st.sp];
  return { st, isNew };
}

// ---------- Keräyspisteet ----------
const XP_ON = false; // kokemus pois päältä toistaiseksi
const NODE = {
  lataus:   { name:'Elävä tasku',     verb:'LATAA',   icon:'⚡', speed:0.85,win:0.24 },
  romu:     { name:'Ruostekasa',      verb:'SYÖVYTÄ', icon:'⚙', speed:0.9, win:0.22 },
  kaapeli:  { name:'Kaapelikaivo',    verb:'KAIVA',   icon:'〰', speed:0.8, win:0.24 },
  rihmasto: { name:'Villi rihmasto',  verb:'NÄYTE',   icon:'❦', speed:0.7, win:0.22, drift:true },
  ranta:    { name:'Kosteikko',       verb:'KERÄÄ',   icon:'≋', speed:0.75,win:0.22, drift:true },
  arkisto:  { name:'Muistipesä',      verb:'LIITY',   icon:'✺', speed:1.15,win:0.18 },
  hot:      { name:'Kuihtuman ydin',  verb:'LIITY',   icon:'☣', speed:1.5, win:0.13 }
};
const RANGE = 28; // m
let nodes = [];
function hashStr(str){ let h=2166136261; for (const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function seeded(str){ let a=hashStr(str)||1; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function polyArea(p){ let a=0; for (let i=0,j=p.length-1;i<p.length;j=i++) a+=(p[j][0]+p[i][0])*(p[j][1]-p[i][1]); return Math.abs(a/2); }
function genNodes(feats){
  const out=[];
  for (const f of feats){ if (f.kind!=='line' || f.cls!=='road2' || !f.residential || !f.id) continue; const r=seeded(f.id); let acc=40+r()*120, k=0;
    for (let i=1;i<f.pts.length;i++){ const [ax,ay]=f.pts[i-1],[bx,by]=f.pts[i], L=Math.hypot(bx-ax,by-ay);
      while (acc<L){ const t=acc/L, x=ax+(bx-ax)*t, y=ay+(by-ay)*t; if (out.every(o=>Math.hypot(o.x-x,o.y-y)>60)) out.push({id:f.id+'#k'+(k++),x,y,zone:'kaapeli'}); acc+=250; } acc-=L; } }
  for (const f of feats){ if (!f.zone || !NODE[f.zone]) continue; const r=seeded(f.id);
    if (f.kind==='point'){ out.push({id:f.id+'#0',x:f.x,y:f.y,zone:f.zone}); continue; }
    if (f.kind==='area'){ const n=Math.max(1,Math.min(4,Math.round(polyArea(f.pts)/3000)));
      const xs=f.pts.map(p=>p[0]), ys=f.pts.map(p=>p[1]); const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
      let k=0; for (let t=0;t<60&&k<n;t++){ const x=x0+r()*(x1-x0), y=y0+r()*(y1-y0);
        if (inPoly(x,y,f.pts) && out.every(o=>Math.hypot(o.x-x,o.y-y)>35)){ out.push({id:f.id+'#'+k,x,y,zone:f.zone}); k++; } } continue; }
    if (f.kind==='line'){ let acc=60,k=0; for (let i=1;i<f.pts.length;i++){ const [ax,ay]=f.pts[i-1],[bx,by]=f.pts[i], L=Math.hypot(bx-ax,by-ay);
        while (acc<L){ const t=acc/L; out.push({id:f.id+'#'+(k++),x:ax+(bx-ax)*t,y:ay+(by-ay)*t,zone:f.zone}); acc+=150; } acc-=L; } }
  }
  return out;
}
const ready = n => (S.cooldowns[n.id]||0) <= Date.now();
function nearestNode(onlyReady){ let best=null,bd=1e9; for (const n of nodes){ if (onlyReady && !ready(n)) continue; const d=Math.hypot(n.x-P.x,n.y-P.y); if (d<bd){bd=d;best=n;} } return best?{n:best,d:bd}:null; }

// ---------- Minipeli ----------
let MG=null;
function startGather(){
  const near=nearestNode(false); if (!near || near.d>RANGE || !ready(near.n)) return;
  const n=near.n, cfg=NODE[n.zone], Z=ZONES[n.zone];
  if (n.zone==='lataus' && S.carry.empty<1){ log('Ei tyhjiä kennoja. Pura ladatut kennot pesäkkeellä tai kasvata lisää kennoja.'); return; }
  if (n.zone!=='lataus' && repUsed()>=repCap()){ log('Reppu täynnä. Pura se pesäkkeellä.'); return; }
  const cfgEff = Object.assign({}, cfg, (S.focus>0) ? {win:Math.min(0.5,cfg.win*1.35)} : {});
  MG={ node:n, cfg:cfgEff, round:0, hits:0, pos:0, target:0.2+Math.random()*0.55, t0:performance.now(), lock:false, res:[] };
  const o=$('mg'); o.style.setProperty('--c',Z.color); o.style.display='flex';
  $('mg-title').textContent=`${cfg.verb}: ${cfg.name.toUpperCase()}`;
  $('mg-desc').textContent = n.zone==='ranta' ? 'Napauta, kun osoitin osuu kalan kohdalle.' : (n.zone==='hot'||n.zone==='arkisto') ? 'Napauta, kun signaali lukittuu ikkunaan. Nopea!' : 'Napauta, kun osoitin on merkityllä alueella.';
  renderMG(); requestAnimationFrame(mgLoop);
}
function renderMG(){ $('mg-dots').innerHTML=[0,1,2].map(i=>`<span class="dot ${MG.res[i]===true?'hit':MG.res[i]===false?'miss':''}"></span>`).join(''); }
function mgLoop(t){
  if (!MG) return;
  const dt=Math.min(0.05,(t-(MG.last||t))/1000); MG.last=t;
  if (!MG.lock){ MG.pos=mgPos(t);
    if (MG.cfg.drift) MG.target = Math.max(0,Math.min(1-MG.cfg.win, MG.target + Math.sin(t/400)*0.004)); }
  const tw=$('mg-track').clientWidth; $('mg-cur').style.transform=`translateX(${MG.pos*tw}px)`;
  $('mg-tgt').style.left=(MG.target*100)+'%'; $('mg-tgt').style.width=(MG.cfg.win*100)+'%';
  requestAnimationFrame(mgLoop);
}
function mgPos(t){ const ph=((t-MG.t0)/1000*MG.cfg.speed)%2; return ph<1?ph:2-ph; }
function strike(){
  if (!MG || MG.lock) return;
  MG.pos=mgPos(performance.now());   // osuma lasketaan kosketushetken mukaan, ei edellisen ruudunpäivityksen
  const hit = MG.pos>=MG.target && MG.pos<=MG.target+MG.cfg.win;
  MG.res.push(hit); if (hit) MG.hits++; MG.lock=true; renderMG();
  const fb=$('mg-fb'); fb.textContent = hit?'OSUMA!':'OHI'; fb.className = hit?'ok':'no';
  try{ navigator.vibrate && navigator.vibrate(hit?30:[10,40,10]); }catch(e){}
  setTimeout(()=>{ fb.textContent=''; MG.round++;
    if (MG.round>=3){ const m=MG; MG=null; $('mg').style.display='none'; finishGather(m.node,m.hits); return; }
    MG.target=0.05+Math.random()*(0.9-MG.cfg.win); MG.t0=performance.now()-Math.random()*800; MG.lock=false; }, 450);
}
$('mg').addEventListener('pointerdown', e=>{ e.preventDefault(); strike(); });

// ---------- Keräys ----------
const QUALITY=['KÖMPELÖ','KELVOLLINEN','HYVÄ','TÄYDELLINEN'];
function finishGather(node,hits){
  const Z=ZONES[node.zone], cfg=NODE[node.zone];
  if (S.focus>0) S.focus--;
  S.finds=S.finds||[];
  if (node.zone==='lataus'){
    const n = hits>=1 ? S.carry.empty : Math.min(1, S.carry.empty);
    S.carry.empty-=n; for (let i=0;i<n;i++) S.carry.cells.push(Date.now()); S.cooldowns[node.id]=Date.now()+COOLDOWN_MS;
    S.finds.unshift({t:Date.now(), item:'Ladattu kenno', n, place:cfg.name, q:hits});
    log(`${n} kennoa ladattu · ${cfg.name}`);
    showLoot('','▮',`${n} kennoa ladattu`,`${QUALITY[hits]} (${hits}/3) · kennot vuotavat hiljalleen – vie ne pesäkkeelle`,'#3ee8ff',false,'LATAUS');
    floatText(`+${n} ▮`,'#3ee8ff'); save(); updateUI(true); return;
  }
  if (node.zone==='rihmasto'){
    const {st,isNew}=sampleStrain(node,hits), mass = Math.min(hits>=2?2:1, Math.max(0,repCap()-repUsed()));
    S.inv.Rihmastomassa=(S.inv.Rihmastomassa||0)+mass; S.cooldowns[node.id]=Date.now()+COOLDOWN_MS;
    S.finds.unshift({t:Date.now(), item:st.sp+'-kanta', n:1, place:cfg.name, q:hits});
    S.newCount=(S.newCount||0)+1+mass; const sp=SPECIALS[st.sp];
    log(`Näyte: ${st.sp}-kanta (${st.k}/${st.s}/${st.si})`);
    showLoot('','❦',`${st.sp}-kanta`,`Kasvu ${st.k} · Saanto ${st.s} · Sitkeys ${st.si}${isNew?' · UUSI!':''} · vie pesäkkeelle ennen kuin näyte kuolee`, sp.color, isNew, 'NÄYTE');
    floatText('+1 näyte', sp.color); save(); updateUI(true); return;
  }
  let roll = Math.random()*100 - hits*9;
  let pick = Z.loot[0], pi = 0;
  let acc = 0; const rev = Z.loot.slice().reverse(); for (let k=0;k<rev.length;k++){ acc += rev[k][1]; if (roll < acc){ pick = rev[k]; pi = Z.loot.length-1-k; break; } }
  if (hits===0){ pick=Z.loot[0]; pi=0; }
  let n = hits===0 ? 1 : pick[2] + Math.floor(Math.random()*(pick[3]-pick[2]+1)) + (hits>=2?1:0);
  let toolTxt='';
  if (node.zone==='romu' && S.equip && S.equip.name==='Kaivinsieni'){ n+=1; S.equip.dur--; toolTxt=' · kaivinsieni +1';
    if (S.equip.dur<=0){ S.equip=null; setTimeout(()=>log('Kaivinsieni kuoli.'),50); } }
  const room=Math.max(0, repCap()-repUsed()); if (n>room){ n=room; toolTxt+=' · reppu täyttyi'; }
  S.inv[pick[0]] = (S.inv[pick[0]]||0) + n;
  S.cooldowns[node.id] = Date.now() + COOLDOWN_MS;
  S.finds.unshift({t:Date.now(), item:pick[0], n, place:cfg.name, q:hits}); S.finds.length=Math.min(S.finds.length,60);
  S.newCount=(S.newCount||0)+n;
  log(`+${n} ${pick[0]} · ${cfg.name}`);
  const [rn,rc] = RARITY[Math.min(pi,2)];
  showLoot('', ICONS[pick[0]]||'◇', `${pick[0]} ×${n}`, `${QUALITY[hits]} (${hits}/3)${toolTxt} · ${rn.toLowerCase()}`, rc, pi>=2, (Z.hot?'⚠ ':'')+'LÖYDÖS');
  floatText(`+${n} ${pick[0]}`, rc);
  save(); updateUI(true);
}

  const rr = 80*zoom;

    const [X,Y]=scr(x,y); if (X<-rr||Y<-rr||X>W+rr||Y>Hh+rr) continue;

// ---------- Signaalimittari (ääni + värinä) ----------
let AC=null, sigOn=false, noiseBuf=null, staticSrc=null, staticGain=null, nextClick=0, lockBeat=0, lastInRange=null, lastNear80=null;
const ZONE_FREQ={lataus:2400, romu:1500, kaapeli:1800, rihmasto:1200, ranta:2100, arkisto:3000, hot:3600};
const VIB={hot:[80,60,80,60,200], arkisto:[40,40,40,40,40], ranta:[120,80,120], default:[60,40,60]};
function initAudio(){
  AC = new (window.AudioContext||window.webkitAudioContext)();
  noiseBuf = AC.createBuffer(1, AC.sampleRate*1, AC.sampleRate);
  const d=noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  staticGain = AC.createGain(); staticGain.gain.value=0;
  const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.7;
  staticSrc = AC.createBufferSource(); staticSrc.buffer=noiseBuf; staticSrc.loop=true;
  staticSrc.connect(bp).connect(staticGain).connect(AC.destination); staticSrc.start();
}
function thump(t, f, vol){
  const o=AC.createOscillator(), g=AC.createGain(); o.type='sine';
  o.frequency.setValueAtTime(f*1.6,t); o.frequency.exponentialRampToValueAtTime(f,t+0.08);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.25);
}
// symbiontin syke: "lub-dub"; sävy riippuu kohteen tyypistä
function tick(freq, vol){ const t=AC.currentTime, f=48+freq/60; thump(t, f, vol); thump(t+0.14, f*1.15, vol*0.6); }
function beep(freq){
  const t=AC.currentTime;
  for (const [k,fq] of [[0,freq],[0.07,freq*1.5]]){ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=fq;
    g.gain.setValueAtTime(0.0001,t+k); g.gain.exponentialRampToValueAtTime(0.05,t+k+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+k+0.5);
    o.connect(g).connect(AC.destination); o.start(t+k); o.stop(t+k+0.55); }
}
const vib = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
$('b-sig').onclick = () => {
  if (!AC) { try { initAudio(); } catch(e){ log('Ääni ei ole käytettävissä tässä selaimessa.'); return; } }
  AC.resume && AC.resume();
  sigOn=!sigOn; $('b-sig').textContent = 'SYKE: '+(sigOn?'PÄÄLLÄ':'POIS'); $('b-sig').classList.toggle('on',sigOn);
  if (!sigOn && staticGain) staticGain.gain.value=0;
  if (sigOn) log('Symbiontin syke kuuluu. Mitä tiheämpi, sitä lähempänä.');
};
const sigMax = () => 160 + (S.solmu&&S.solmu.upg.suodin?100:0) + (S.solmu?S.solmu.valo*40:0);
function signal(dt){
  const nr=nearestNode(true);
  const d = nr ? nr.d : Infinity;
  // visuaalinen palkki
  const SIG_MAX=sigMax(); const lvl = d<=RANGE ? 10 : d>=SIG_MAX ? 0 : Math.max(1, Math.round(10*(1-(d-RANGE)/(SIG_MAX-RANGE))));
  const col = nr ? ZONES[nr.n.zone].color : '#ffb000';
  $('sig-bar').innerHTML = `<span style="color:${col};text-shadow:0 0 6px ${col}">${'▮'.repeat(lvl)}</span>${'▯'.repeat(10-lvl)}`;
  // värinä: lähestyminen (80 m) ja kantaman sisälle tulo
  if (nr && d<80 && lastNear80!==nr.n.id){ lastNear80=nr.n.id; vib(30); }
  if (nr && d<=RANGE && lastInRange!==nr.n.id){ lastInRange=nr.n.id; vib(VIB[nr.n.zone]||VIB.default); }
  if (!nr || d>RANGE) lastInRange = null;
  if (!sigOn || !AC) return;
  // staattinen kohina hot zonella
  const z=zoneAt(P.x,P.y); staticGain.gain.value = (z && z.zone==='hot') ? 0.035+0.02*Math.random() : 0;
  if (!nr || d>=SIG_MAX) return;
  const rate = d<=RANGE ? 3.2 : 0.6 + 2.4*Math.pow(1-(d-RANGE)/(SIG_MAX-RANGE), 1.5);
  nextClick -= dt;
  if (nextClick<=0){ tick(ZONE_FREQ[nr.n.zone]||2000, 0.5); nextClick = 1/rate * (0.92+Math.random()*0.16); }
  if (d<=RANGE){ lockBeat -= dt; if (lockBeat<=0){ beep(nr.n.zone==='hot'?740:520); lockBeat=2.0; } }
}

// ---------- Silmukka ----------
let last=performance.now(), uiTick=0;
function loop(t){
  const dt=Math.min(0.1,(t-last)/1000); last=t;
  if (P.mode==='sim' && P.tx!==null){ const dx=P.tx-P.x, dy=P.ty-P.y, d=Math.hypot(dx,dy), s=SIM_SPEED*dt;
    if (d<=s){ P.x=P.tx; P.y=P.ty; P.tx=P.ty=null; moved(d); } else { P.x+=dx/d*s; P.y+=dy/d*s; moved(s); } }
  if (keys.size && P.mode==='sim'){ let vx=0,vy=0; if(keys.has('ArrowLeft')||keys.has('a'))vx--; if(keys.has('ArrowRight')||keys.has('d'))vx++; if(keys.has('ArrowUp')||keys.has('w'))vy--; if(keys.has('ArrowDown')||keys.has('s'))vy++;
    if (vx||vy){ const n=Math.hypot(vx,vy), s=SIM_SPEED*dt, c=Math.cos(ROT), si=Math.sin(ROT); const ux=vx/n, uy=vy/n; P.x+=(ux*c-uy*si)*s; P.y+=(ux*si+uy*c)*s; P.tx=P.ty=null; moved(s); } }
  signal(dt);
  updateHeading(dt);
  if (!MG) draw(t);
  if ((uiTick+=dt)>0.25){ uiTick=0; updateUI(); }
  requestAnimationFrame(loop);
}

// ---------- Syöte ----------
const keys=new Set(); addEventListener('keydown',e=>keys.add(e.key)); addEventListener('keyup',e=>keys.delete(e.key));
let pinch=null, down=null;
cv.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY}; });
cv.addEventListener('pointerup',e=>{ if(!down) return; const moved_=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null;
  if (moved_<8 && P.mode==='sim' && !pinch){ const [wx_,wy_]=unscr(e.clientX,e.clientY); P.tx=wx_; P.ty=wy_; } });
cv.addEventListener('wheel',e=>{ e.preventDefault(); zoom=Math.max(0.5,Math.min(4,zoom*(e.deltaY<0?1.12:0.89))); },{passive:false});
cv.addEventListener('touchstart',e=>{ if(e.touches.length===2){ const [a,b]=e.touches; pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:zoom}; } },{passive:true});
cv.addEventListener('touchmove',e=>{ if(pinch&&e.touches.length===2){ const [a,b]=e.touches; zoom=Math.max(0.5,Math.min(4,pinch.z*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch.d)); } },{passive:true});
cv.addEventListener('touchend',e=>{ if(e.touches.length<2) setTimeout(()=>pinch=null,50); },{passive:true});

const GEO_ERR={1:'LUPA EVÄTTY (tarkista selaimen ja puhelimen sijaintiasetukset)',2:'SIJAINTI EI SAATAVILLA (GPS-signaali puuttuu)',3:'AIKAKATKAISU (GPS ei ehtinyt vastata)'};
let geoErr='';
function getPosition(){ return new Promise(res=>{
  if (!window.isSecureContext){ geoErr='SIVU EI OLE HTTPS-OSOITTEESSA'; return res(null); }
  if (!navigator.geolocation){ geoErr='SELAIN EI TUE SIJAINTIA'; return res(null); }
  let done=false; const finish=v=>{ if(!done){ done=true; clearTimeout(to); res(v); } };
  const to=setTimeout(()=>{ geoErr=geoErr||GEO_ERR[3]; finish(null); },25000);
  const tryOnce=(high,next)=>{ try { navigator.geolocation.getCurrentPosition(p=>finish(p), e=>{ geoErr=GEO_ERR[e.code]||('VIRHE '+e.code); if (e.code===1) finish(null); else next(); }, {enableHighAccuracy:high, timeout:12000, maximumAge:60000}); } catch(e){ geoErr='VIRHE: '+e.message; finish(null); } };
  tryOnce(true, ()=>tryOnce(false, ()=>finish(null)));   // ensin tarkka GPS, sitten verkkopohjainen sijainti
}); }

let watchId=null;
function startWatch(){
  if (!navigator.geolocation || !window.isSecureContext || watchId!==null) return;
  watchId = navigator.geolocation.watchPosition(p=>{
    const [x,y]=toXY(p.coords.latitude,p.coords.longitude); const now=Date.now();
    if (P.mode!=='gps'){ // GPS löytyi myöhemmin: siirrytään oikeaan sijaintiin
      if (Math.hypot(x,y) > 2500){ log('GPS LÖYTYI KAUKAA – lataa sivu uudelleen, niin kartta haetaan sijaintisi ympäriltä.'); }
      P.mode='gps'; P.tx=P.ty=null; lastFix=null; $('st-pos').textContent='SIJAINTI: GPS'; $('hint').textContent='Liiku ulkona. Nipistys = zoom.'; log('GPS-LUKITUS SAATU');
    }
    if (lastFix){ const d=Math.hypot(x-lastFix.x,y-lastFix.y), sp=d/Math.max(1,(now-lastFix.t)/1000);
      if (sp>50){ log('SIJAINTIHYPPY HYLÄTTY'); return; } // huijausesto: mahdoton nopeus
      if (sp<7) moved(d); else log('LIIAN NOPEA (>25 km/h)'); }
    lastFix={x,y,t:now}; P.x=x; P.y=y;
  }, e=>{ const now=Date.now(); if (P.mode==='gps' && (!lastFix || now-lastFix.t>20000) && now-(window._gpsErrT||0)>30000){ window._gpsErrT=now; log('GPS: '+(GEO_ERR[e.code]||e.message)); } }, {enableHighAccuracy:true, maximumAge:2000, timeout:30000});
}

async function boot(){
  const B=$('boot'); const say=s=>{ B.textContent += s+'\n'; }; bootSay=say;
  say('SYMBIONTTI-YHTEYS v2.0'); say('...kuuletko meitä? Me kuulemme sinut.'); say('');
  say('> Haetaan sijaintia (voi kestää 10–20 s)...');
  const pos = await getPosition();
  if (pos){ origin={lat:pos.coords.latitude, lon:pos.coords.longitude}; P.mode='gps'; say('  GPS-LUKITUS OK'); }
  else { origin={...START}; P.mode='sim'; say('  GPS EPÄONNISTUI: '+(geoErr||'tuntematon syy')); say('  → SIMULOITU SIJAINTI (Turku, Kauppatori). GPS:ää yritetään taustalla.'); }
  say('> Ladataan karttadataa (OpenStreetMap)...');
  let data='OSM';
  try { features = await loadStartArea(origin.lat, origin.lon); if (features.length<5) throw new Error('liian vähän dataa'); say(`  ${features.length} kohdetta ladattu (${osmNote})`); }
  catch(e){ features = demoCity(); data='DEMO'; mapMode='DEMO'; osmFail=e.message; say('  KARTTADATA EPÄONNISTUI: '+e.message); say('  → SIMULOITU DEMOKAUPUNKI. Paina yläpalkin HAE KARTTA yrittääksesi uudelleen.'); }
  zoneFeatures = features.filter(f=>f.zone && f.id);
  nodes = genNodes(zoneFeatures.concat(features.filter(f=>f.residential)));
  $('st-pos').textContent = 'SIJAINTI: ' + (P.mode==='gps'?'GPS':'SIMULOITU');
  $('st-data').textContent = 'DATA: ' + data;
  $('hint').textContent = P.mode==='sim' ? 'Napauta karttaa liikkuaksesi (tai nuolinäppäimet). Rulla/nipistys = zoom.' : 'Liiku ulkona. Nipistys = zoom.';
  startWatch();
  moved(0.0001);
  say(''); say('> VALMIS. Paina mitä tahansa...');
  await new Promise(r=>setTimeout(r,900));
  B.style.transition='opacity .4s'; B.style.opacity='0'; setTimeout(()=>B.remove(),450);
  if (P.mode==='sim' && geoErr) log('GPS: '+geoErr);
  if (data==='DEMO'){ log('KARTTA: '+osmFail);
    const bm=$('b-map'); bm.style.display='inline-block';
    bm.onclick = async () => { if (bm.disabled) return; bm.disabled=true; bm.textContent='HAETAAN...'; $('st-data').textContent='DATA: HAETAAN...';
      const here = toLL(P.x,P.y);
      try { origin = {lat:here.lat, lon:here.lon}; P.x=0; P.y=0; lastFix=null; P.tx=P.ty=null;
        for (const k in tiles) delete tiles[k]; seenOSM=new Set();
        const f = await loadStartArea(origin.lat, origin.lon); if (f.length<5) throw new Error('liian vähän dataa');
        features=f; zoneFeatures=features.filter(f=>f.zone&&f.id); nodes=genNodes(zoneFeatures.concat(features.filter(f=>f.residential))); mapMode='OSM';
        $('st-data').textContent='DATA: OSM'; bm.style.display='none'; log('Oikea karttadata ladattu ('+osmNote+').'); }
      catch(e){ $('st-data').textContent='DATA: DEMO'; bm.textContent='HAE KARTTA'; log('KARTTA: '+e.message); }
      bm.disabled=false; };
  }
  log(data==='DEMO' ? 'Demokaupunki ladattu. Etsi värillisiä vyöhykkeitä.' : 'Karttadata ladattu. Etsi värillisiä vyöhykkeitä.');
  updateUI(true);
}
boot();
requestAnimationFrame(loop);
if (location.hash==='#debug') window.DBG={P, get nodes(){return nodes}, get S(){return S}, finishGather, solmuAction, SM};
})();
</script>
